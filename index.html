<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FF6700">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PBPro">
    
    <title>Press Brake Pro v6.8 AI</title>
    
    <style>
        :root { 
            --bg: #0a0a0a; --card: #141414; 
            --primary: #FF6700; --success: #00e676; --danger: #ff1744;
            --text-light: #f5f5f5; --text-muted: #888; 
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; background: var(--bg); color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }

        /* Versio-rivi pyynnön mukaan vihreänä */
        .version-tag {
            color: #00e676; font-weight: 800; font-size: 1.1em;
            text-align: center; padding: 10px; background: #111;
            border-bottom: 1px solid #333;
        }
        
        .container { max-width: 480px; margin: 0 auto; padding: 15px; padding-bottom: 100px; }

        /* Dashboard */
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .dash-box { 
            background: #1a1a1a; padding: 15px; border-radius: 16px; 
            text-align: center; border: 1px solid #333; 
        }
        .dash-val { font-size: 1.8em; font-weight: 800; color: #fff; display: block; }
        .dash-lbl { font-size: 0.6em; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }

        /* AI-painike koko arkin skannaukseen */
        .btn-full-scan {
            width: 100%; padding: 22px; border-radius: 16px; border: 3px solid var(--success);
            background: linear-gradient(145deg, #0d2b0d 0%, #051505 100%);
            color: var(--success); font-weight: 900; font-size: 1.1em;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4); margin-bottom: 20px;
        }

        /* Tietokentät */
        .info-row { display: grid; gap: 8px; margin-bottom: 20px; }
        .info-box { 
            background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        .info-box span { font-size: 0.7em; color: #777; font-weight: 700; text-transform: uppercase; }
        .info-box b { font-size: 1.1em; color: var(--primary); }

        /* Pääpainikkeet */
        .main-btn {
            width: 100%; padding: 18px; border-radius: 14px; border: none;
            font-size: 1em; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-bottom: 10px;
        }
        .btn-save { background: var(--primary); color: white; }
        .btn-start { background: var(--success); color: black; }
        .btn-stop { background: var(--danger); color: white; }

        /* Kamera-overlay Honor-optimoinnilla */
        #camera-overlay {
            display: none; position: fixed; inset: 0; background: #000; z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .video-wrapper {
            width: 90%; height: 50%; border: 2px solid var(--success); border-radius: 15px;
            overflow: hidden; position: relative; background: #111;
        }
        #video { width: 100%; height: 100%; object-fit: cover; }

        /* Numpad */
        #numpad-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 85%; }
        .key { 
            background: #222; padding: 25px; border-radius: 12px; text-align: center;
            font-size: 1.8em; font-weight: 800; border: 1px solid #333; color: white;
        }

        /* Latausruutu analyysin ajaksi */
        .loader { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); 
            z-index: 10001; flex-direction: column; align-items: center; justify-content: center; 
        }
        .spinner { border: 4px solid #333; border-top: 4px solid var(--success); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hist-list { background: #050505; border-radius: 12px; border: 1px solid #222; max-height: 200px; overflow-y: auto; margin-top: 15px; }
        .hist-item { display: grid; grid-template-columns: 80px 1fr 60px; padding: 12px; border-bottom: 1px solid #111; font-size: 0.8em; }
    </style>
</head>
<body>

<div class="version-tag">v6.8 AI-VISION PRO • FINAL STABLE</div>

<div class="container">
    <div class="dashboard">
        <div class="dash-box">
            <span class="dash-lbl">Vuoro</span>
            <span id="txt-timer" class="dash-val">00:00</span>
        </div>
        <div class="dash-box">
            <span class="dash-lbl">Tehokkuus</span>
            <span id="txt-eff" class="dash-val">0.00</span>
        </div>
    </div>

    <button id="btn-open-camera" class="btn-full-scan">
        🤖 SKANNAA KORTTI (AI)
    </button>

    <div class="info-row">
        <div class="info-box" onclick="openPad('kortti')"><span>Työnumero</span><b id="val-kortti">-</b></div>
        <div class="info-box" onclick="askLajike()"><span>Lajimerkki</span><b id="val-lajike">-</b></div>
        <div class="info-box" onclick="openPad('asetus')"><span>Asetus</span><b id="val-asetus">-</b></div>
        <div class="info-box" onclick="openPad('taivutus')"><span>Std-aika</span><b id="val-taivutus">-</b></div>
    </div>

    <button id="btn-save" class="main-btn btn-save">💾 TALLENNA KORTTI</button>
    <button id="btn-shift" class="main-btn btn-start">ALOITA VUORO</button>

    <div class="hist-list" id="hist-list"></div>
    
    <button onclick="resetHistory()" style="width:100%; background:none; border:none; color:#444; margin-top:20px; font-size:0.8em; text-decoration: underline;">NOLLAA HISTORIA</button>
</div>

<div id="camera-overlay">
    <div class="video-wrapper"><video id="video" playsinline></video></div>
    <button id="btn-capture" style="background:var(--success); color:black; padding:20px 50px; border-radius:40px; border:none; font-weight:900; font-size:1.2em; margin-top:20px;">📸 OTA KUVA</button>
    <button onclick="stopCamera()" style="background:none; border:none; color:white; margin-top:20px; text-decoration:underline;">PERUUTA</button>
</div>

<div id="numpad-overlay">
    <div id="pad-display" style="color:var(--primary); font-size:3em; font-weight:800; margin-bottom:20px;">-</div>
    <div class="numpad-grid" id="keys"></div>
    <button onclick="closePad()" style="margin-top:25px; background:none; border:none; color:#666; font-weight:800;">SULJE</button>
</div>

<div id="loader" class="loader">
    <div class="spinner"></div>
    <p style="margin-top:20px; font-weight:bold; color:var(--success);">Claude AI analysoi arkkia...</p>
</div>

<script>
// --- TILA ---
const State = {
    running: false,
    startTime: null,
    padTarget: '',
    padBuffer: '',
    history: JSON.parse(localStorage.getItem('pbpro_v68') || '[]')
};

// --- KAMERAOHJAUS ---
async function startCamera() {
    const video = document.getElementById('video');
    document.getElementById('camera-overlay').style.display = 'flex';
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "environment", width: { ideal: 1920 } }
        });
        video.srcObject = stream;
        await video.play();
    } catch (err) {
        alert("Kamera-virhe: " + err.message);
        stopCamera();
    }
}

function stopCamera() {
    const video = document.getElementById('video');
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('camera-overlay').style.display = 'none';
}

// --- AI ANALYYSI (Claude 3.5 Sonnet) ---
document.getElementById('btn-capture').onclick = async () => {
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
    stopCamera();
    document.getElementById('loader').style.display = 'flex';

    let apiKey = localStorage.getItem('claude_api_key');
    if (!apiKey) {
        apiKey = prompt("Syötä Claude API-avain:");
        if (apiKey) localStorage.setItem('claude_api_key', apiKey.trim());
    }

    const promptText = "Analyze this production card. Focus on SÄRMÄYS (Press Brake). Extract ONLY JSON: tyonumero (6-digits), lajike (UPPERCASE), asetus (min), stdaika (min).";

    try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': apiKey,
                'anthropic-version': '2023-06-01',
                'dangerously-allow-browser': 'true'
            },
            body: JSON.stringify({
                model: "claude-3-5-sonnet-20240620",
                max_tokens: 1024,
                messages: [{
                    role: "user",
                    content: [
                        { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64Image } },
                        { type: "text", text: promptText }
                    ]
                }]
            })
        });

        if (!response.ok) {
            const rawError = await response.text();
            throw new Error(`HTTP ${response.status}: ${rawError}`);
        }

        const result = await response.json();
        const data = JSON.parse(result.content[0].text);

        document.getElementById('val-kortti').innerText = data.tyonumero || "-";
        document.getElementById('val-lajike').innerText = (data.lajike || "-").toUpperCase();
        document.getElementById('val-asetus').innerText = data.asetus ? data.asetus + " min" : "-";
        document.getElementById('val-taivutus').innerText = data.stdaika ? data.stdaika + " min" : "-";

    } catch (err) {
        alert(`AI VIRHE:\n${err.message}\n\nVarmista saldo ja avain.`);
    } finally {
        document.getElementById('loader').style.display = 'none';
    }
};

// --- NUMPAD JA MANUAALISYÖTTÖ ---
function openPad(target) {
    State.padTarget = target;
    State.padBuffer = '';
    document.getElementById('pad-display').innerText = '-';
    document.getElementById('numpad-overlay').style.display = 'flex';
    
    const grid = document.getElementById('keys');
    grid.innerHTML = '';
    for(let i=1; i<=9; i++) grid.innerHTML += `<div class="key" onclick="press(${i})">${i}</div>`;
    grid.innerHTML += `<div class="key" onclick="State.padBuffer=''; document.getElementById('pad-display').innerText='-';">C</div>`;
    grid.innerHTML += `<div class="key" onclick="press(0)">0</div>`;
    grid.innerHTML += `<div class="key" style="background:var(--success); color:black" onclick="savePad()">OK</div>`;
}

function press(n) {
    if (State.padTarget === 'kortti' && State.padBuffer.length >= 6) return;
    State.padBuffer += n;
    document.getElementById('pad-display').innerText = State.padBuffer;
}

function savePad() {
    if (State.padTarget === 'kortti' && State.padBuffer.length !== 6) { 
        alert("Työnumeron oltava 6 numeroa!"); return; 
    }
    document.getElementById('val-' + State.padTarget).innerText = State.padBuffer + (State.padTarget==='kortti'?'':' min');
    closePad();
}

function closePad() { document.getElementById('numpad-overlay').style.display = 'none'; }

function askLajike() {
    let val = prompt("Syötä lajimerkki:");
    if (val) document.getElementById('val-lajike').innerText = val.toUpperCase();
}

// --- VUORO JA HISTORIA ---
function toggleShift() {
    const btn = document.getElementById('btn-shift');
    if (!State.running) {
        State.running = true;
        State.startTime = Date.now();
        btn.innerText = "LOPETA VUORO";
        btn.className = "main-btn btn-stop";
    } else {
        State.running = false;
        btn.innerText = "ALOITA VUORO";
        btn.className = "main-btn btn-start";
    }
}

function saveEntry() {
    const nr = document.getElementById('val-kortti').innerText;
    if (nr === "-" || nr.length !== 6) { alert("Työnumero puuttuu!"); return; }

    const entry = {
        id: Date.now(),
        nr: nr,
        laji: document.getElementById('val-lajike').innerText,
        min: parseFloat(document.getElementById('val-asetus').innerText) + parseFloat(document.getElementById('val-taivutus').innerText) || 0
    };

    State.history.unshift(entry);
    localStorage.setItem('pbpro_v68', JSON.stringify(State.history));
    ['val-kortti','val-lajike','val-asetus','val-taivutus'].forEach(id => document.getElementById(id).innerText = "-");
    renderHistory();
}

function renderHistory() {
    document.getElementById('hist-list').innerHTML = State.history.slice(0, 10).map(e => `
        <div class="hist-item">
            <b style="color:var(--primary)">${e.nr}</b>
            <span>${e.laji}</span>
            <span style="text-align:right">${e.min}m</span>
        </div>
    `).join('');
}

function resetHistory() {
    if (confirm("Haluatko varmasti nollata koko jakson historian?")) {
        State.history = [];
        localStorage.removeItem('pbpro_v68');
        renderHistory();
    }
}

// --- KELLO ---
setInterval(() => {
    if (State.running) {
        const diff = Date.now() - State.startTime;
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        document.getElementById('txt-timer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
        let totalValmisMin = State.history.reduce((a, b) => a + b.min, 0);
        document.getElementById('txt-eff').innerText = (totalValmisMin / (diff / 60000 || 1)).toFixed(2);
    }
}, 1000);

document.getElementById('btn-open-camera').onclick = startCamera;
document.getElementById('btn-save').onclick = saveEntry;
document.getElementById('btn-shift').onclick = toggleShift;
renderHistory();
</script>
</body>
</html>
