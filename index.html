<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PBPro v8.7</title>
    <style>
        :root { --bg: #0a0a0a; --primary: #FF6700; --success: #00e676; --danger: #ff1744; }
        body { margin: 0; background: var(--bg); color: #f5f5f5; font-family: sans-serif; text-align: center; touch-action: manipulation; }
        .version-tag { color: var(--success); font-weight: bold; padding: 10px; background: #111; border-bottom: 1px solid #333; font-size: 0.8em; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }
        .btn-scan { width: 100%; padding: 25px; border-radius: 16px; border: 3px solid var(--success); background: #051505; color: var(--success); font-weight: 900; font-size: 1.2em; cursor: pointer; margin-bottom: 20px; }
        .info-box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .info-box b { color: var(--primary); font-size: 1.2em; }
        .main-btn { width: 100%; padding: 20px; border-radius: 14px; border: none; font-size: 1.1em; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; }
        .btn-save { background: var(--primary); color: white; }
        .btn-start { background: var(--success); color: black; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        #cam-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; }
    </style>
</head>
<body>

<div class="version-tag">v8.7 ULTIMATE ACCESS FIX</div>

<div class="container">
    <button id="btn-open-camera" class="btn-scan">🤖 SKANNAA KORTTI</button>
    <div class="info-row">
        <div class="info-box"><span>Työnumero</span><b id="val-kortti">-</b></div>
        <div class="info-box"><span>Lajike</span><b id="val-lajike">-</b></div>
        <div class="info-box"><span>Asetus</span><b id="val-asetus">-</b></div>
        <div class="info-box"><span>Std-aika</span><b id="val-stdaika">-</b></div>
    </div>
    <button id="btn-save" class="main-btn btn-save">💾 TALLENNA KORTTI</button>
    <button id="btn-shift" class="main-btn btn-start">ALOITA VUORO</button>
    <button onclick="localStorage.removeItem('claude_api_key'); location.reload();" style="color:#444; background:none; border:none; margin-top:20px; text-decoration:underline;">VAIHDA API-AVAIN</button>
</div>

<div id="loader"><p id="load-text">Analysoidaan...</p></div>

<div id="cam-overlay">
    <video id="video" style="width:100%; height:80%; object-fit:cover;" playsinline></video>
    <button id="snap" style="width:80%; margin:20px; padding:20px; background:var(--success); border-radius:50px; border:none; font-weight:bold; position:absolute; bottom:20px; left:10%;">📸 OTA KUVA</button>
</div>

<script>
let stream;
async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({video: {facingMode:"environment", width: 1280}});
        document.getElementById('video').srcObject = stream;
        document.getElementById('video').play();
        document.getElementById('cam-overlay').style.display = 'block';
    } catch(e) { alert("Kamera-virhe: " + e.message); }
}

async function snap() {
    const v = document.getElementById('video');
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const base64 = c.toDataURL('image/jpeg', 0.6).split(',')[1];
    
    stream.getTracks().forEach(t => t.stop());
    document.getElementById('cam-overlay').style.display = 'none';
    document.getElementById('loader').style.display = 'flex';

    let key = localStorage.getItem('claude_api_key') || prompt("Syötä API-avain:");
    if(key) localStorage.setItem('claude_api_key', key.trim());

    // KÄYTETÄÄN SUORAA YHTEYTTÄ ILMAN PROXYA, KOSKA CLAUDE VAATII NYT SITÄ
    try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': key,
                'anthropic-version': '2023-06-01',
                'anthropic-dangerous-direct-browser-access': 'true'
            },
            body: JSON.stringify({
                model: "claude-3-5-sonnet-20240620",
                max_tokens: 1000,
                messages: [{role: "user", content: [
                    {type: "image", source: {type: "base64", media_type: "image/jpeg", data: base64}},
                    {type: "text", text: "Extract JSON only: {tyonumero:6-digits, lajike:uppercase, asetus:number, stdaika:number}"}
                ]}]
            })
        });

        const data = await response.json();
        if (data.error) {
            alert("CLAUDE VIRHE: " + data.error.message);
        } else {
            const res = JSON.parse(data.content[0].text);
            document.getElementById('val-kortti').innerText = res.tyonumero;
            document.getElementById('val-lajike').innerText = res.lajike;
            document.getElementById('val-asetus').innerText = res.asetus + " min";
            document.getElementById('val-stdaika').innerText = res.stdaika + " min";
        }
    } catch(e) {
        alert("VERKKOVIRHE: Failed to fetch. Kokeile ladata sivu uudelleen tai asentaa se kuvakkeeksi!");
    } finally {
        document.getElementById('loader').style.display = 'none';
    }
}

document.getElementById('btn-open-camera').onclick = startCamera;
document.getElementById('snap').onclick = snap;
</script>
</body>
</html>
