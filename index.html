<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>PBPro v19.7</title>
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22PBPro%22,%22short_name%22:%22PBPro%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230a0a0a%22,%22theme_color%22:%22%230a0a0a%22,%22icons%22:[{%22src%22:%22https://cdn-icons-png.flaticon.com/512/8061/8061453.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <style>
        :root { --bg: #0a0a0a; --primary: #FF6700; --success: #00e676; --danger: #ff1744; --openai: #74aa9c; }
        body { margin: 0; background: var(--bg); color: #f5f5f5; font-family: sans-serif; text-align: center; }
        .version-tag { color: #fff; font-weight: bold; padding: 10px; background: #004d40; border-bottom: 2px solid var(--openai); font-size: 0.8em; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; padding-bottom: 120px; }
        .period-header { background: #111; padding: 15px; border-radius: 16px; border: 1px solid var(--openai); margin-bottom: 10px; }
        .period-dates { font-size: 0.85em; color: var(--openai); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; }
        .period-stats { display: flex; justify-content: space-around; border-top: 1px solid #222; padding-top: 10px; margin-top: 5px; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .dash-box { background: #1a1a1a; padding: 12px; border-radius: 16px; border: 1px solid #333; }
        .dash-label { font-size: 0.65em; color: #888; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .dash-val { font-size: 1.5em; font-weight: 800; color: var(--success); }
        .pace-val { font-size: 1.8em; color: var(--openai); font-weight: 900; display: block; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; text-align: left; }
        .info-box { background: #111; padding: 12px; border-radius: 12px; border: 1px solid #333; cursor: pointer; min-height: 45px; }
        .info-box span { font-size: 0.65em; color: #888; display: block; text-transform: uppercase; }
        .info-box b { color: var(--primary); font-size: 1.05em; display: block; word-break: break-all; }
        .main-btn { width: 100%; padding: 18px; border-radius: 14px; border: none; font-size: 1.1em; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; cursor: pointer; }
        .btn-scan { width: 100%; padding: 25px; border-radius: 16px; border: 3px solid var(--openai); background: #0a1a15; color: var(--openai); font-weight: 900; font-size: 1.2em; cursor: pointer; margin-bottom: 20px; }
        #search-input { width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 10px; color: white; margin-bottom: 15px; box-sizing: border-box; }
        .hist-item { background: #1a1a1a; padding: 12px; margin-bottom: 8px; border-radius: 12px; text-align: left; border-left: 4px solid var(--primary); position: relative; }
        .hist-item.work-shift { border-left: 4px solid var(--success); background: #112211; }
        .hist-actions { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; gap: 12px; }
        .btn-icon { background: none; border: none; color: #888; cursor: pointer; font-size: 1.3em; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        #cam-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; flex-direction: column; }
    </style>
</head>
<body>

<div class="version-tag">v19.7 • PWA ENABLED & DATA SAFE</div>

<div class="container">
    <div class="period-header">
        <div id="txt-period-dates" class="period-dates">-</div>
        <div class="period-stats">
            <div><span class="dash-label">Jakson Kerroin</span><span id="txt-period-pace" class="pace-val">0.00</span></div>
            <div style="border-left: 1px solid #222; padding-left: 20px;"><span class="dash-label">Jakson Tunnit</span><span id="txt-period-hours" class="pace-val" style="color:#fff">0.0</span></div>
        </div>
    </div>
    
    <div class="dashboard">
        <div class="dash-box"><span class="dash-label">Vuoron Tunnit (h)</span><span id="txt-timer" class="dash-val">0.00</span></div>
        <div class="dash-box"><span class="dash-label">Vuoro Joutuisuus</span><span id="txt-shift-pace" class="dash-val">0.00</span></div>
    </div>

    <button id="btn-open-camera" class="btn-scan">📸 SKANNAA KORTTI</button>
    
    <div class="info-grid">
        <div class="info-box" onclick="editV('val-tyonr', 'Työnumero')"><span>Työnumero</span><b id="val-tyonr">-</b></div>
        <div class="info-box" onclick="editV('val-lajike', 'Tuote')"><span>Tuote</span><b id="val-lajike">-</b></div>
        <div class="info-box" onclick="editV('val-piirnro', 'Piirustus nro')"><span>Piirustus nro</span><b id="val-piirnro">-</b></div>
        <div class="info-box" onclick="editV('val-asiakas', 'Asiakas')"><span>Asiakas</span><b id="val-asiakas">-</b></div>
        <div class="info-box" onclick="editV('val-asetusaika', 'Asetus (min)')"><span>Asetus (min)</span><b id="val-asetusaika">-</b></div>
        <div class="info-box" onclick="editV('val-taivutusaika', 'Taivutus (min)')"><span>Taivutus (min)</span><b id="val-taivutusaika">-</b></div>
    </div>

    <button id="btn-save" style="background:var(--primary); color:white" class="main-btn">💾 TALLENNA KORTTI</button>
    <button id="btn-start-shift" style="background:var(--success); color:black" class="main-btn">ALOITA VUORO</button>
    <button id="btn-stop-shift" style="background:var(--danger); color:white; display:none;" class="main-btn">LOPETA VUORO</button>
    
    <input type="text" id="search-input" placeholder="Hae historiasta..." oninput="renderHistory()">
    <div id="hist-list"></div>
</div>

<div id="loader"><p>Skannataan...</p></div>
<div id="cam-overlay">
    <video id="video" style="width:100%; height:100%; object-fit:cover;" playsinline muted></video>
    <div style="position:absolute; bottom:30px; width:100%; text-align:center;">
        <button id="snap" style="width:70px; height:70px; border-radius:50%; background:white; border:5px solid var(--openai);"></button>
    </div>
</div>

<script>
// Pysytään samassa tallennusnimessä kuin v19.6, jotta tiedot löytyvät
const payPeriods2026 = [{ start: "2026-02-16", end: "2026-02-28" }, { start: "2026-03-01", end: "2026-03-15" }];
let State = {
    startTime: localStorage.getItem('pb_start') ? new Date(parseInt(localStorage.getItem('pb_start'))) : null,
    history: JSON.parse(localStorage.getItem('pbpro_hist_v196') || '[]'),
    stream: null
};

function saveToDisk() {
    localStorage.setItem('pbpro_hist_v196', JSON.stringify(State.history));
    if(State.startTime) localStorage.setItem('pb_start', State.startTime.getTime());
    else localStorage.removeItem('pb_start');
}

function updateUI() {
    const now = new Date();
    const p = payPeriods2026.find(p => { 
        const s = new Date(p.start); const e = new Date(p.end); e.setHours(23,59,59); 
        return now >= s && now <= e; 
    }) || payPeriods2026[0];
    document.getElementById('txt-period-dates').innerText = `JAKSO: ${new Date(p.start).toLocaleDateString('fi-FI')} - ${new Date(p.end).toLocaleDateString('fi-FI')}`;

    const pS = new Date(p.start); const pE = new Date(p.end); pE.setHours(23,59,59);
    const pD = State.history.filter(h => {
        const pts = h.pvm.split('.'); const d = new Date(pts[2], pts[1]-1, pts[0]);
        return d >= pS && d <= pE;
    });

    const shiftHoursInHistory = pD.filter(h => h.isShift).reduce((s, i) => s + (i.hours || 0), 0);
    let currentShiftHours = State.startTime ? (now - State.startTime) / 3600000 : 0;
    
    document.getElementById('btn-start-shift').style.display = State.startTime ? 'none' : 'block';
    document.getElementById('btn-stop-shift').style.display = State.startTime ? 'block' : 'none';

    const totalPeriodHours = shiftHoursInHistory + currentShiftHours;
    document.getElementById('txt-period-hours').innerText = totalPeriodHours.toFixed(1);
    document.getElementById('txt-timer').innerText = currentShiftHours.toFixed(2);

    const todayGoalMins = pD.filter(h => h.pvm === now.toLocaleDateString('fi-FI') && !h.isShift).reduce((s, i) => s + (i.sumMins || 0), 0);
    const periodGoalMins = pD.filter(h => !h.isShift).reduce((s, i) => s + (i.sumMins || 0), 0);

    document.getElementById('txt-shift-pace').innerText = currentShiftHours > 0.01 ? ((todayGoalMins/60)/currentShiftHours).toFixed(2) : "0.00";
    document.getElementById('txt-period-pace').innerText = totalPeriodHours > 0.01 ? ((periodGoalMins/60)/totalPeriodHours).toFixed(2) : "0.00";
}

document.getElementById('btn-start-shift').onclick = () => {
    const i = prompt("Aloitusaika? (esim. 07.00)", new Date().getHours() + "." + (new Date().getMinutes()<10?'0':'') + new Date().getMinutes());
    if(i !== null) {
        const d = new Date(); const p = i.split(/[:.]/); d.setHours(parseInt(p[0])); d.setMinutes(parseInt(p[1]||0)); d.setSeconds(0);
        State.startTime = d; saveToDisk(); updateUI();
    }
};

document.getElementById('btn-stop-shift').onclick = () => {
    const i = prompt("Lopetusaika?", new Date().getHours() + "." + (new Date().getMinutes()<10?'0':'') + new Date().getMinutes());
    if(i !== null) {
        const d = new Date(); const p = i.split(/[:.]/); d.setHours(parseInt(p[0])); d.setMinutes(parseInt(p[1]||0)); d.setSeconds(0);
        State.history.unshift({ id: Date.now(), pvm: d.toLocaleDateString('fi-FI'), isShift: true, hours: (d - State.startTime) / 3600000, info: `Vuoro: ${State.startTime.getHours()}.${State.startTime.getMinutes()} - ${d.getHours()}.${d.getMinutes()}` });
        State.startTime = null; saveToDisk(); renderHistory(); updateUI();
    }
};

document.getElementById('btn-open-camera').onclick = async () => {
    try {
        State.stream = await navigator.mediaDevices.getUserMedia({video: {facingMode:"environment", width: {ideal: 1920}}});
        document.getElementById('video').srcObject = State.stream;
        document.getElementById('cam-overlay').style.display='flex';
        document.getElementById('video').play();
    } catch(e) { alert("Salli kamera."); }
};

document.getElementById('snap').onclick = async () => {
    const v = document.getElementById('video'), c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight; c.getContext('2d').drawImage(v, 0, 0);
    const b64 = c.toDataURL('image/jpeg', 0.8);
    if(State.stream) State.stream.getTracks().forEach(t => t.stop());
    document.getElementById('cam-overlay').style.display='none';
    document.getElementById('loader').style.display='flex';
    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('openai_api_key') },
            body: JSON.stringify({
                model: "gpt-4o",
                messages: [{ role: "user", content: [
                    { type: "text", text: "Lue kortista: Työnumero (6 nro), Tuote, Piirustus, Asiakas. Etsi rivi 'Taivutus' tai 'Särmäys'. Lue siltä riviltä nimenomaan KAPASITEETTIAIKA (min). JSON: {\"tyo\":\"...\",\"piir\":\"...\",\"asia\":\"...\",\"laji\":\"...\",\"asetus\":\"...\",\"taivutus\":\"...\"}" },
                    { type: "image_url", image_url: { url: b64 } }
                ]}]
            })
        });
        const d = await response.json(); const res = JSON.parse(d.choices[0].message.content.match(/\{.*\}/s)[0]);
        document.getElementById('val-tyonr').innerText = (res.tyo || "").replace(/\D/g, '').substring(0,6) || "-";
        document.getElementById('val-lajike').innerText = (res.laji || "-").toUpperCase();
        document.getElementById('val-piirnro').innerText = res.piir || "-";
        document.getElementById('val-asiakas').innerText = res.asia || "-";
        document.getElementById('val-asetusaika').innerText = (res.asetus || "0").replace(',','.');
        document.getElementById('val-taivutusaika').innerText = (res.taivutus || "0").replace(',','.');
    } catch(e) { alert("Virhe."); }
    finally { document.getElementById('loader').style.display='none'; }
};

document.getElementById('btn-save').onclick = () => {
    const tyo = document.getElementById('val-tyonr').innerText;
    if(tyo === "-" || tyo.length < 6) return alert("Työnumero virheellinen!");
    const kpl = prompt("Kpl-määrä?", "1");
    if(!kpl) return;
    const a = parseFloat(document.getElementById('val-asetusaika').innerText) || 0;
    const k = parseFloat(document.getElementById('val-taivutusaika').innerText) || 0;
    State.history.unshift({ id: Date.now(), pvm: new Date().toLocaleDateString('fi-FI'), tyo, tuote: document.getElementById('val-lajike').innerText, asia: document.getElementById('val-asiakas').innerText, kpl, sumMins: a + (k * parseInt(kpl)), asetus: a, taivutus: k });
    saveToDisk(); renderHistory(); updateUI();
};

function renderHistory() {
    const s = document.getElementById('search-input').value.toLowerCase();
    const f = State.history.filter(h => (h.tyo||'').toLowerCase().includes(s) || (h.asia||'').toLowerCase().includes(s));
    document.getElementById('hist-list').innerHTML = f.map(e => `
        <div class="hist-item ${e.isShift ? 'work-shift' : ''}">
            <div style="padding-right: 80px;">${e.isShift ? `<b>⏱️ VUORO</b><br><small>${e.info} • ${e.hours.toFixed(2)} h</small>` : `<b>${e.tyo}</b> | ${e.tuote}<br><small>${e.asia} • ${e.kpl} kpl • ${e.sumMins.toFixed(1)} min</small>`}</div>
            <div class="hist-actions"><button class="btn-icon" onclick="editHist(${e.id})">✏️</button><button class="btn-icon" onclick="if(confirm('Poista?')){State.history=State.history.filter(h=>h.id!=${e.id});saveToDisk();renderHistory();updateUI();}">🗑️</button></div>
        </div>`).join('');
}

function editHist(id) {
    const item = State.history.find(h => h.id === id);
    if(!item) return;
    if(item.isShift) {
        const nH = prompt("Muokkaa tunteja (h):", item.hours);
        if(nH) { item.hours = parseFloat(nH); saveToDisk(); renderHistory(); updateUI(); }
    } else {
        const nTyo = prompt("Työnumero:", item.tyo);
        const nKpl = prompt("Kpl-määrä:", item.kpl);
        if(nTyo && nKpl) { item.tyo = nTyo.replace(/\D/g, '').substring(0,6); item.kpl = nKpl; item.sumMins = parseFloat(item.asetus) + (parseFloat(item.taivutus) * parseInt(nKpl)); saveToDisk(); renderHistory(); updateUI(); }
    }
}

function closeCam() { if(State.stream) State.stream.getTracks().forEach(t => t.stop()); document.getElementById('cam-overlay').style.display='none'; }
function editV(id, msg) { let v = prompt(msg, document.getElementById(id).innerText); if(v!==null) { if(id==='val-lajike')v=v.toUpperCase(); document.getElementById(id).innerText=v; } }

// Service Worker asennusta varten
if ('serviceWorker' in navigator) {
    const sw = `self.addEventListener('fetch', function(event) { event.respondWith(fetch(event.request)); });`;
    const blob = new Blob([sw], {type: 'text/javascript'});
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url);
}

setInterval(updateUI, 5000); updateUI(); renderHistory();
</script>
</body>
</html>
