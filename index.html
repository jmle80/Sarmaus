<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Press Brake Pro">
    
    <title>Press Brake Pro v4.0</title>
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Ikonit -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --bg: #0a0a0a; --card: #141414; --dark-panel: #1a1a1a; 
            --primary: #FF6700; --accent: #FF8533; --success: #00e676; 
            --warning: #ffd600; --danger: #ff1744; --special: #78909c; 
            --blue: #2979ff; --text-light: #f5f5f5; --text-muted: #888; 
            --tb-accent: #00e676; --tb-blue: #2962ff; 
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }
        
        .app-container {
            height: 100vh;
            height: 100dvh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .container { 
            background: var(--card); 
            padding: 12px; 
            border-radius: 0; 
            max-width: 100%; 
            margin: 0 auto; 
            padding-bottom: 80px; 
            position: relative; 
            min-height: 100%;
        }
        
        @media (min-width: 480px) {
            .container { max-width: 480px; border-radius: 24px; margin: 10px auto; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        }
        
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; margin-top: 8px; }
        .dashboard-box { 
            background: linear-gradient(145deg, var(--dark-panel) 0%, #0f0f0f 100%); 
            color: var(--text-light); border-radius: 16px; padding: 14px 6px; 
            text-align: center; border: 1px solid #333; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
            display: flex; flex-direction: column; justify-content: space-between; min-height: 110px;
            position: relative; overflow: hidden; cursor: pointer;
            transition: all 0.2s;
        }
        .dashboard-box:active { transform: scale(0.98); }
        .dashboard-box::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
        .dashboard-box.hold-active { 
            border-color: var(--primary); 
            box-shadow: 0 0 30px rgba(255,103,0,0.3);
        }
        .dash-title { font-size: 0.65em; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px; }
        .dash-value { 
            font-size: 2.4em; font-weight: 800; line-height: 1; 
            background: linear-gradient(180deg, #fff 0%, #aaa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .dash-sub-label { font-size: 0.6em; color: #666; margin-top: 6px; font-weight: 600; }
        .dash-sub-val { font-size: 1.1em; font-weight: 700; color: var(--primary); }

        .main-clock { 
            font-size: 2.4em; font-weight: 300; font-family: 'SF Mono', 'Courier New', monospace; 
            text-align: center; margin: 0 0 15px 0; color: #fff; letter-spacing: 2px;
            background: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
            border-radius: 14px; padding: 12px; border: 1px solid #333;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .time-info-box {
            background: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%);
            border-radius: 14px; padding: 15px; margin-bottom: 15px;
            border: 1px solid #333; text-align: center;
        }
        .time-info-row {
            display: flex; justify-content: space-around; align-items: center;
            gap: 15px;
        }
        .time-info-item {
            flex: 1;
        }
        .time-info-label {
            font-size: 0.65em; color: #666; text-transform: uppercase;
            letter-spacing: 1.2px; font-weight: 700; margin-bottom: 6px;
        }
        .time-info-value {
            font-size: 1.9em; font-weight: 300; font-family: 'SF Mono', monospace;
            color: var(--primary); letter-spacing: 2px;
        }

        .timeline-wrapper { 
            margin-bottom: 15px; background: linear-gradient(145deg, #1a1a1a 0%, #0f0f0f 100%); 
            padding: 12px; border-radius: 14px; border: 1px solid #333
