<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>PBPro v28.5</title>
    <style>
        :root { --bg: #0a0a0a; --primary: #FF6700; --success: #00e676; --danger: #ff1744; --openai: #74aa9c; }
        body { margin: 0; background: var(--bg); color: #f5f5f5; font-family: sans-serif; text-align: center; overflow-x: hidden; }
        .version-tag { color: #fff; font-weight: bold; padding: 10px; background: #2e7d32; border-bottom: 2px solid #fff; font-size: 0.8em; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; padding-bottom: 120px; }
        
        .period-header { background: #111; padding: 15px; border-radius: 16px; border: 1px solid var(--openai); margin-bottom: 10px; position: relative; }
        .period-stats { display: flex; justify-content: space-around; border-top: 1px solid #222; padding-top: 10px; gap: 5px; }
        .stat-col { flex: 1; border-right: 1px solid #222; }
        .stat-col:last-child { border-right: none; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .dash-box { background: #1a1a1a; padding: 12px; border-radius: 16px; border: 1px solid #333; }
        .dash-label { font-size: 0.65em; color: #888; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .dash-val { font-size: 1.4em; font-weight: 800; color: var(--success); }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; text-align: left; }
        .info-box { background: #111; padding: 12px; border-radius: 12px; border: 1px solid #333; cursor: pointer; min-height: 45px; }
        .info-box span { font-size: 0.65em; color: #888; display: block; text-transform: uppercase; }
        .info-box b { color: var(--primary); font-size: 1.05em; display: block; word-break: break-all; }
        .combined-box { grid-column: span 2; }

        .main-btn { width: 100%; padding: 18px; border-radius: 14px; border: none; font-size: 1.1em; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; cursor: pointer; }
        .btn-scan { width: 100%; padding: 25px; border-radius: 16px; border: 3px solid var(--openai); background: #0a1a15; color: var(--openai); font-weight: 900; font-size: 1.2em; cursor: pointer; margin-bottom: 20px; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; padding: 20px; overflow-y: auto; }
        .modal-content { background: #1a1a1a; border-radius: 20px; padding: 20px; text-align: left; max-width: 440px; margin: 0 auto; border: 1px solid #333; }
        .modal-content input { width: 100%; background: #222; border: 1px solid #444; padding: 12px; border-radius: 10px; color: white; box-sizing: border-box; margin-bottom: 10px; }
        
        #cam-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; }
        #video-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; }
        
        .hist-item { background: #1a1a1a; padding: 12px; margin-bottom: 8px; border-radius: 12px; text-align: left; border-left: 4px solid var(--primary); position: relative; }
        .hist-item.work-shift { border-left-color: var(--success); }
    </style>
</head>
<body>

<div class="version-tag">v28.5 • STABILITY RECOVERY</div>

<div class="container">
    <div class="period-header">
        <span style="position:absolute;top:10px;right:10px;color:#444;" onclick="resetAll()">nollaa</span>
        <div id="txt-period-dates" style="font-size:0.8em; color:var(--openai); font-weight:bold; margin-bottom:10px;">JAKSO: -</div>
        <div class="period-stats">
            <div class="stat-col"><span class="dash-label">Kerroin</span><span id="txt-period-pace">0.00</span></div>
            <div class="stat-col"><span class="dash-label">Tunnit</span><span id="txt-period-hours">0.0</span></div>
            <div class="stat-col"><span class="dash-label">Jakson t</span><span id="txt-period-weight" style="color:var(--primary);">0kg</span></div>
        </div>
    </div>
    
    <div class="dashboard">
        <div class="dash-box"><span class="dash-label">Vuoron h</span><span id="txt-timer" class="dash-val">0.00</span></div>
        <div class="dash-box"><span class="dash-label">Joutuisuus</span><span id="txt-shift-pace" class="dash-val">0.00</span></div>
    </div>

    <button onclick="openCam()" class="btn-scan">📸 SKANNAA KORTTI</button>
    
    <div class="info-grid">
        <div class="info-box combined-box" onclick="editCombined()">
            <span>Tuote & Kuvaus</span>
            <b id="val-lajike">-</b><b id="val-kuvaus">-</b>
        </div>
        <div class="info-box" onclick="editV('val-tyonr', 'Työnumero')"><span>Työnumero</span><b id="val-tyonr">-</b></div>
        <div class="info-box" onclick="editV('val-piirnro', 'Piirustus')"><span>Piirustus</span><b id="val-piirnro">-</b></div>
        <div class="info-box" onclick="editV('val-asiakas', 'Asiakas')"><span>Asiakas</span><b id="val-asiakas">-</b></div>
        <div class="info-box" onclick="editV('val-paino', 'Paino (kg)')"><span>Paino (kg)</span><b id="val-paino">-</b></div>
        <div class="info-box" onclick="openMuutModal()" style="grid-column: span 2; background:#1a231a;">
            <span style="color:#00e676;">TYÖVAIHE</span><b id="val-muu-nimi">-</b>
        </div>
        <div class="info-box" onclick="editV('val-asetusaika', 'Asetus')"><span>Asetus</span><b id="val-asetusaika">-</b></div>
        <div class="info-box" onclick="editV('val-taivutusaika', 'Aika')"><span>Aika</span><b id="val-taivutusaika">-</b></div>
    </div>

    <button onclick="saveEntry()" style="background:var(--primary); color:white" class="main-btn">💾 TALLENNA KORTTI</button>
    <button id="btn-start" onclick="startShift()" style="background:var(--success); color:black" class="main-btn">ALOITA VUORO</button>
    <button id="btn-stop" onclick="stopShift()" style="background:var(--danger); color:white; display:none;" class="main-btn">LOPETA VUORO</button>
    
    <input type="text" id="search-input" placeholder="Hae..." oninput="renderHistory()" style="width:100%; padding:10px; background:#222; border:1px solid #444; border-radius:10px; color:white; margin-bottom:10px; box-sizing:border-box;">
    <div id="hist-list"></div>
</div>

<div id="muut-modal" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--success)">Työvaihe</h3>
        <input type="text" id="muu-nimi-in" placeholder="Nimi">
        <input type="text" id="muu-asetus-in" placeholder="Asetus (min)">
        <input type="text" id="muu-aika-in" placeholder="Aika/kpl (min)">
        <button onclick="saveMuut()" style="width:100%; padding:15px; background:var(--success); border:none; border-radius:10px; font-weight:bold;">TALLENNA</button>
        <button onclick="closeModal('muut-modal')" style="width:100%; margin-top:10px; background:none; color:#888; border:none;">PERUUTA</button>
    </div>
</div>

<div id="cam-overlay">
    <div id="video-container"><video id="video" playsinline muted></video></div>
    <div style="position:absolute; bottom:30px; width:100%; text-align:center;">
        <button onclick="takeSnap()" style="width:70px; height:70px; border-radius:50%; background:white; border:5px solid var(--openai);"></button><br><br>
        <button onclick="closeCam()" style="color:white; background:none; border:none; font-weight:bold;">SULJE</button>
    </div>
</div>

<div id="loader"><p>Käsitellään...</p></div>

<script>
const payPeriods = [{ start: "2026-02-16", end: "2026-02-28" }, { start: "2026-03-01", end: "2026-03-15" }];
let State = {
    startTime: localStorage.getItem('pb_start') ? new Date(parseInt(localStorage.getItem('pb_start'))) : null,
    history: JSON.parse(localStorage.getItem('pbpro_master_history') || '[]'),
    stream: null
};

function saveToDisk() {
    localStorage.setItem('pbpro_master_history', JSON.stringify(State.history));
    if(State.startTime) localStorage.setItem('pb_start', State.startTime.getTime());
    else localStorage.removeItem('pb_start');
}

function fixDecimals(val) {
    if (!val || val === "-") return "0";
    let s = val.toString().replace(',', '.');
    if (!s.includes('.') && s.length >= 3) return (parseFloat(s) / 100).toString();
    return s.replace(/[^0-9.]/g, '') || "0";
}

function updateUI() {
    const now = new Date();
    const p = payPeriods.find(p => { 
        const s = new Date(p.start); const e = new Date(p.end); e.setHours(23,59,59); 
        return now >= s && now <= e; 
    }) || payPeriods[0];
    
    document.getElementById('txt-period-dates').innerText = `JAKSO: ${new Date(p.start).toLocaleDateString('fi-FI')} - ${new Date(p.end).toLocaleDateString('fi-FI')}`;
    const pS = new Date(p.start); const pE = new Date(p.end); pE.setHours(23,59,59);
    
    const pD = State.history.filter(h => {
        try {
            const pts = h.pvm.split('.'); 
            const d = new Date(pts[2], pts[1]-1, pts[0]);
            return d >= pS && d <= pE;
        } catch(e) { return false; }
    });

    const shiftHoursInHist = pD.filter(h => h.isShift).reduce((s, i) => s + (parseFloat(i.hours) || 0), 0);
    let curShiftH = State.startTime ? (now - State.startTime) / 3600000 : 0;
    const totalH = shiftHoursInHist + curShiftH;
    
    const totalKg = pD.filter(h => !h.isShift).reduce((s, i) => s + ((parseFloat(i.paino) || 0) * (parseInt(i.kpl) || 0)), 0);
    document.getElementById('txt-period-weight').innerText = totalKg >= 1000 ? (totalKg/1000).toFixed(2) + "t" : Math.round(totalKg) + "kg";
    document.getElementById('txt-period-hours').innerText = totalH.toFixed(1);
    document.getElementById('txt-timer').innerText = curShiftH.toFixed(2);
    
    const goalMins = pD.filter(h => !h.isShift).reduce((s, i) => s + (parseFloat(i.sumMins) || 0), 0);
    const todayGoal = pD.filter(h => h.pvm === now.toLocaleDateString('fi-FI') && !h.isShift).reduce((s, i) => s + (parseFloat(i.sumMins) || 0), 0);
    
    document.getElementById('txt-shift-pace').innerText = curShiftH > 0.01 ? ((todayGoal/60)/curShiftH).toFixed(2) : "0.00";
    document.getElementById('txt-period-pace').innerText = totalH > 0.01 ? ((goalMins/60)/totalH).toFixed(2) : "0.00";
    
    document.getElementById('btn-start').style.display = State.startTime ? 'none' : 'block';
    document.getElementById('btn-stop').style.display = State.startTime ? 'block' : 'none';
}

function renderHistory() {
    const s = document.getElementById('search-input').value.toLowerCase();
    const f = State.history.filter(h => (h.tyo||'').toLowerCase().includes(s) || (h.kuvaus||'').toLowerCase().includes(s));
    document.getElementById('hist-list').innerHTML = f.slice(0,20).map(e => `
        <div class="hist-item ${e.isShift ? 'work-shift' : ''}">
            ${e.isShift ? `<b>⏱️ VUORO</b><br><small>${e.info}</small>` : 
            `<b>${e.tyo}</b> | ${e.tuote}<br><small>${e.vaihe || 'SÄRMÄYS'} • ${e.paino}kg • ${e.kpl} kpl</small>`}
            <div style="position:absolute; right:10px; top:10px;" onclick="deleteEntry(${e.id})">🗑️</div>
        </div>`).join('');
}

function openMuutModal() { document.getElementById('muut-modal').style.display = 'block'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function saveMuut() {
    document.getElementById('val-muu-nimi').innerText = document.getElementById('muu-nimi-in').value.toUpperCase() || "-";
    document.getElementById('val-asetusaika').innerText = fixDecimals(document.getElementById('muu-asetus-in').value);
    document.getElementById('val-taivutusaika').innerText = fixDecimals(document.getElementById('muu-aika-in').value);
    closeModal('muut-modal');
}

function editV(id, msg) { let v = prompt(msg, document.getElementById(id).innerText); if(v!==null) document.getElementById(id).innerText = v.toUpperCase(); }
function editCombined() { 
    let t = prompt("Tuote:", document.getElementById('val-lajike').innerText); 
    let k = prompt("Kuvaus:", document.getElementById('val-kuvaus').innerText);
    if(t) document.getElementById('val-lajike').innerText = t.toUpperCase();
    if(k) document.getElementById('val-kuvaus').innerText = k.toUpperCase();
}

function saveEntry() {
    const tyo = document.getElementById('val-tyonr').innerText;
    if(tyo === "-") return alert("Ei tietoja");
    const kpl = prompt("Kpl-määrä?", "1");
    if(!kpl) return;
    const a = parseFloat(document.getElementById('val-asetusaika').innerText) || 0;
    const t = parseFloat(document.getElementById('val-taivutusaika').innerText) || 0;
    const p = parseFloat(document.getElementById('val-paino').innerText) || 0;
    const v = document.getElementById('val-muu-nimi').innerText === "-" ? "SÄRMÄYS" : document.getElementById('val-muu-nimi').innerText;
    State.history.unshift({ id: Date.now(), pvm: new Date().toLocaleDateString('fi-FI'), tyo, tuote: document.getElementById('val-lajike').innerText, kuvaus: document.getElementById('val-kuvaus').innerText, paino: p, kpl, vaihe: v, sumMins: a + (t * parseInt(kpl)) });
    saveToDisk(); renderHistory(); updateUI();
}

function deleteEntry(id) { if(confirm("Poistetaanko?")) { State.history = State.history.filter(h => h.id !== id); saveToDisk(); renderHistory(); updateUI(); } }
function startShift() { State.startTime = new Date(); saveToDisk(); updateUI(); }
function stopShift() {
    const d = new Date();
    State.history.unshift({ id: Date.now(), pvm: d.toLocaleDateString('fi-FI'), isShift: true, hours: (d - State.startTime) / 3600000, info: `Vuoro: ${State.startTime.getHours()}.${State.startTime.getMinutes()} - ${d.getHours()}.${d.getMinutes()}` });
    State.startTime = null; saveToDisk(); updateUI(); renderHistory();
}
function resetAll() { if(confirm("Nollataanko koko historia?")) { State.history = []; saveToDisk(); renderHistory(); updateUI(); } }

async function openCam() {
    try {
        State.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
        document.getElementById('video').srcObject = State.stream;
        document.getElementById('cam-overlay').style.display='block';
        document.getElementById('video').play();
    } catch(e) { alert("Kamera-virhe"); }
}
function closeCam() { if(State.stream) State.stream.getTracks().forEach(t=>t.stop()); document.getElementById('cam-overlay').style.display='none'; }
async function takeSnap() {
    const v = document.getElementById('video'), c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const b64 = c.toDataURL('image/jpeg', 0.8);
    closeCam();
    document.getElementById('loader').style.display='flex';
    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('openai_api_key') },
            body: JSON.stringify({
                model: "gpt-4o",
                messages: [{ role: "user", content: [{ type: "text", text: "Analysoi työkortti. Työnumero, Tuote, Kuvaus, Asiakas, Särmäysajat ja paino kg kohdasta 'Tarve per yksi' alta. JSON: {\"tyo\":\"...\",\"laji\":\"...\",\"kuvaus\":\"...\",\"asia\":\"...\",\"paino\":\"...\",\"asetus\":\"...\",\"taivutus\":\"...\"}" }, { type: "image_url", image_url: { url: b64 } }]}]
            })
        });
        const d = await response.json(); const res = JSON.parse(d.choices[0].message.content.match(/\{.*\}/s)[0]);
        document.getElementById('val-tyonr').innerText = res.tyo || "-";
        document.getElementById('val-lajike').innerText = (res.laji || "-").toUpperCase();
        document.getElementById('val-kuvaus').innerText = (res.kuvaus || "-").toUpperCase();
        document.getElementById('val-asiakas').innerText = res.asia || "-";
        document.getElementById('val-paino').innerText = fixDecimals(res.paino);
        document.getElementById('val-asetusaika').innerText = fixDecimals(res.asetus);
        document.getElementById('val-taivutusaika').innerText = fixDecimals(res.taivutus);
    } catch(e) { console.error(e); }
    finally { document.getElementById('loader').style.display='none'; }
}

window.onload = () => { updateUI(); renderHistory(); setInterval(updateUI, 10000); };
</script>
</body>
</html>
