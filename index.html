<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Työvuoroseuranta Pro v5.1</title>
    <style>
        :root {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --accent: #00e676; /* Neonvihreä */
            --danger: #ff5252;
            --input-bg: #2c2c2c;
            --border: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--bg-card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* VERSIONUMERO */
        .version-tag {
            font-size: 0.9em;
            font-weight: bold;
            color: #ffab40;
            text-align: center;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 { text-align: center; color: var(--accent); margin: 5px 0 20px 0; font-size: 1.8em; }

        /* INPUTS */
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9em; }
        input, select {
            width: 100%; padding: 12px;
            background: var(--input-bg); border: 1px solid var(--border);
            color: white; border-radius: 6px; font-size: 16px;
            box-sizing: border-box; transition: 0.2s;
        }
        input:focus { border-color: var(--accent); outline: none; }
        
        /* SKANNERI */
        #ean-scan { border-color: var(--accent); background: rgba(0, 230, 118, 0.05); }

        /* PAINIKKEET */
        .btn-row { display: flex; gap: 10px; margin-bottom: 15px; }
        button {
            flex: 1; padding: 14px; border: none; border-radius: 6px;
            font-weight: bold; cursor: pointer; text-transform: uppercase;
            font-size: 14px; transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-start { background: var(--accent); color: #000; }
        .btn-stop { background: var(--danger); color: #fff; }
        .btn-secondary { background: #424242; color: #fff; }
        .btn-menu { background: #333; color: #ccc; border: 1px solid #444; }

        /* STATUS & CLOCK */
        .status-bar {
            background: #252525; padding: 15px; border-radius: 8px;
            text-align: center; margin-bottom: 20px; border: 1px solid #333;
        }
        #clock { font-size: 2em; font-family: monospace; font-weight: bold; color: var(--text-main); }
        #status-text { color: var(--accent); font-weight: bold; margin-top: 5px; }

        /* HISTORIA */
        .history-list {
            list-style: none; padding: 0; margin-top: 20px;
            max-height: 300px; overflow-y: auto;
        }
        .history-item {
            background: #252525; border-bottom: 1px solid #333;
            padding: 10px; display: flex; justify-content: space-between; align-items: center;
            font-size: 0.9em;
        }
        .history-item span { display: block; }
        .history-time { color: #888; font-size: 0.8em; }

        /* MODAL (ERIKOISTILAT & ASETUKSET) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000; padding: 20px; box-sizing: border-box;
            overflow-y: auto;
        }
        .modal-content {
            background: var(--bg-card); padding: 20px; border-radius: 8px;
            max-width: 500px; margin: 40px auto; border: 1px solid var(--accent);
        }
        .modal h2 { margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .close-btn { background: #444; margin-top: 20px; }
        
        /* TIME INPUT IN MODAL */
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }

    </style>
</head>
<body>

    <div class="container">
        <span class="version-tag">Versio 5.1 (Time Edit)</span>
        <h1>Työvuoroseuranta</h1>

        <div class="status-bar">
            <div id="clock">00:00:00</div>
            <div id="status-text">Vuoro ei käynnissä</div>
            <div id="shift-timer" style="font-size:0.9em; color:#888; margin-top:5px;">Kesto: 00:00:00</div>
        </div>

        <div class="input-group">
            <label>EAN / Viivakoodi (Skannaa tähän)</label>
            <input type="text" id="ean-scan" placeholder="Lue viivakoodi..." autofocus onblur="keepFocus()">
        </div>

        <div class="btn-row">
            <div style="flex:1">
                <label>Kortin nro (6 numeroa)</label>
                <input type="text" id="card-input" placeholder="123456" maxlength="6">
            </div>
            <div style="flex:1">
                <label>Lajimerkki</label>
                <input type="text" id="grade-input" placeholder="S355...">
            </div>
        </div>

        <div class="btn-row">
            <button class="btn-start" onclick="askTime('start')">Aloita Vuoro</button>
            <button class="btn-stop" onclick="askTime('stop')">Lopeta</button>
        </div>
        
        <div class="btn-row">
            <button class="btn-menu" onclick="openModal('special-modal')">⚡ Erikoistilat</button>
            <button class="btn-menu" onclick="openModal('range-modal')">📅 Aikaväli</button>
            <button class="btn-menu" onclick="openModal('settings-modal')">⚙️ Asetukset</button>
        </div>

        <h3>Tapahtumahistoria</h3>
        <ul id="history-list" class="history-list">
            </ul>
        <button class="btn-secondary" style="margin-top:10px;" onclick="clearHistory()">Tyhjennä historia</button>
    </div>

    <div id="time-modal" class="modal">
        <div class="modal-content">
            <h2 id="time-modal-title">Vahvista aika</h2>
            <p>Tarkista kellonaika. Voit muuttaa sitä tarvittaessa.</p>
            
            <div class="input-group">
                <label>Kellonaika</label>
                <input type="time" id="manual-time" style="font-size: 1.5em; text-align: center;">
            </div>

            <div class="btn-row">
                <button id="confirm-time-btn" class="btn-start" onclick="confirmTime()">Vahvista & Tallenna</button>
                <button class="btn-secondary" onclick="closeModal('time-modal')">Peruuta</button>
            </div>
        </div>
    </div>

    <div id="special-modal" class="modal">
        <div class="modal-content">
            <h2>Erikoistilat</h2>
            <p>Valitse keskeytyksen tai tilan syy:</p>
            <button class="btn-secondary" onclick="logSpecial('Ruokatauko'); closeModal('special-modal')">🍽️ Ruokatauko</button>
            <br><br>
            <button class="btn-secondary" onclick="logSpecial('Huolto'); closeModal('special-modal')">🔧 Huolto / Häiriö</button>
            <br><br>
            <button class="btn-secondary" onclick="logSpecial('Palaveri'); closeModal('special-modal')">👥 Palaveri</button>
            <br><br>
            <button class="btn-secondary" onclick="logSpecial('Muu työ'); closeModal('special-modal')">📝 Muu työ</button>
            <button class="close-btn" onclick="closeModal('special-modal')">Sulje</button>
        </div>
    </div>

    <div id="range-modal" class="modal">
        <div class="modal-content">
            <h2>Jakson Hallinta</h2>
            <div class="input-group">
                <label>Aloituspvm</label>
                <input type="date" id="range-start">
            </div>
            <div class="input-group">
                <label>Lopetuspvm</label>
                <input type="date" id="range-end">
            </div>
            <button class="btn-start" onclick="filterHistory()">Hae aikaväli</button>
            <button class="close-btn" onclick="closeModal('range-modal')">Sulje</button>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h2>Asetukset & Muokkaus</h2>
            <label>Poista yksittäinen merkintä:</label>
            <select id="remove-select" style="margin-bottom:15px; background:#333;">
                </select>
            <button class="btn-stop" onclick="removeSelectedItem()">Poista valittu</button>
            <hr style="border-color:#444; margin: 20px 0;">
            <button class="btn-secondary" onclick="exportCSV()">Lataa Excel (CSV)</button>
            <button class="close-btn" onclick="closeModal('settings-modal')">Sulje</button>
        </div>
    </div>

    <script>
        // --- ALUSTUS & MUUTTUJAT ---
        let shiftActive = false;
        let shiftStartTime = null;
        let shiftTimerInterval;
        let history = JSON.parse(localStorage.getItem('shiftHistory')) || [];
        let pendingAction = null; // 'start' or 'stop'

        // Ääni
        const alertSound = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU'); 
        
        // --- DOM ELEMENTS ---
        const eanInput = document.getElementById('ean-scan');
        const cardInput = document.getElementById('card-input');
        const gradeInput = document.getElementById('grade-input');

        window.onload = function() {
            updateClock();
            setInterval(updateClock, 1000);
            renderHistory();
            restoreState();
            eanInput.focus();
        };

        // --- EVENT LISTENERS ---
        cardInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6);
            saveState();
        });

        gradeInput.addEventListener('input', function(e) {
            this.value = this.value.toUpperCase();
            saveState();
        });

        eanInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                handleScan(this.value);
                this.value = ''; 
            }
        });

        function keepFocus() {
            setTimeout(() => {
                if (document.activeElement !== cardInput && document.activeElement !== gradeInput && document.querySelector('.modal[style*="block"]') === null) {
                    eanInput.focus();
                }
            }, 200);
        }

        // --- PÄÄTOIMINNOT (UUSI LOGIIKKA) ---

        function askTime(action) {
            if (action === 'start' && shiftActive) return;
            if (action === 'stop' && !shiftActive) return;

            // Tarkista kortti heti alussa
            if (action === 'start' && cardInput.value.length !== 6) {
                alert("Virhe: Kortin numeron pitää olla 6 numeroa.");
                return;
            }

            pendingAction = action;
            
            // Aseta nykyinen aika oletukseksi inputtiin
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0');
            document.getElementById('manual-time').value = timeStr;
            
            // Päivitä otsikko ja napin väri
            const title = document.getElementById('time-modal-title');
            const btn = document.getElementById('confirm-time-btn');
            
            if (action === 'start') {
                title.innerText = "Aloitusaika";
                btn.innerText = "Aloita Vuoro";
                btn.className = "btn-start";
            } else {
                title.innerText = "Lopetusaika";
                btn.innerText = "Lopeta Vuoro";
                btn.className = "btn-stop";
            }

            openModal('time-modal');
        }

        function confirmTime() {
            const timeVal = document.getElementById('manual-time').value;
            if (!timeVal) return;

            // Luodaan Date-objekti käyttäjän syöttämästä ajasta (tälle päivälle)
            const now = new Date();
            const [hours, minutes] = timeVal.split(':');
            const selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hours, minutes);

            if (pendingAction === 'start') {
                performStart(selectedDate);
            } else if (pendingAction === 'stop') {
                performStop(selectedDate);
            }

            closeModal('time-modal');
            pendingAction = null;
        }

        function performStart(startDate) {
            playAlert();
            shiftActive = true;
            shiftStartTime = startDate.getTime(); // Käytetään valittua aikaa
            
            document.getElementById('status-text').innerText = "VUORO KÄYNNISSÄ";
            document.getElementById('status-text').style.color = "#00e676";
            
            logItemWithDate("Vuoro aloitettu", "System", startDate);
            startTimer();
            saveState();
        }

        function performStop(endDate) {
            shiftActive = false;
            clearInterval(shiftTimerInterval);
            document.getElementById('status-text').innerText = "VUORO PÄÄTTYNYT";
            document.getElementById('status-text').style.color = "#ff5252";
            document.getElementById('shift-timer').innerText = "Kesto: 00:00:00";
            
            logItemWithDate("Vuoro lopetettu", "System", endDate);
            saveState();
        }

        function handleScan(code) {
            if (!shiftActive) {
                alert("Aloita vuoro ensin!");
                return;
            }
            if (code.length < 3) return;
            logItem(`Skannaus: ${code}`, "Scan");
            eanInput.style.backgroundColor = "#00e676";
            setTimeout(() => { eanInput.style.backgroundColor = "rgba(0, 230, 118, 0.05)"; }, 200);
        }

        function logSpecial(type) {
            if (!shiftActive) {
                alert("Aloita vuoro ensin!");
                return;
            }
            logItem(`Erikoistila: ${type}`, "Special");
        }

        // --- LOKI & DATA ---

        function logItem(action, type) {
            logItemWithDate(action, type, new Date());
        }

        function logItemWithDate(action, type, dateObj) {
            const entry = {
                id: Date.now(),
                time: dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
                date: dateObj.toLocaleDateString(),
                card: cardInput.value,
                grade: gradeInput.value,
                action: action,
                type: type
            };
            history.unshift(entry);
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            const select = document.getElementById('remove-select');
            list.innerHTML = '';
            select.innerHTML = ''; 

            if (history.length === 0) {
                list.innerHTML = '<li style="color:#666; text-align:center; padding:10px;">Ei tapahtumia</li>';
                return;
            }

            history.forEach(item => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <div>
                        <span style="font-weight:bold; color:#fff">${item.action}</span>
                        <span class="history-time">${item.date} ${item.time} | ${item.grade}</span>
                    </div>
                `;
                list.appendChild(li);

                const option = document.createElement('option');
                option.value = item.id;
                option.text = `${item.time} - ${item.action}`;
                select.appendChild(option);
            });
        }

        // --- UI APUFUNKTIOT ---

        function openModal(id) {
            document.getElementById(id).style.display = 'block';
            if(id === 'settings-modal') renderHistory();
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
            eanInput.focus();
        }

        function removeSelectedItem() {
            const select = document.getElementById('remove-select');
            const idToRemove = parseInt(select.value);
            if (!idToRemove) return;
            if(confirm("Poistetaanko valittu merkintä?")) {
                history = history.filter(item => item.id !== idToRemove);
                saveHistory();
                renderHistory();
            }
        }

        function clearHistory() {
            if(confirm("Haluatko varmasti nollata koko jakson historian? Tätä ei voi perua.")) {
                history = [];
                saveHistory();
                renderHistory();
            }
        }

        function filterHistory() {
            const startStr = document.getElementById('range-start').value;
            const endStr = document.getElementById('range-end').value;
            if(!startStr || !endStr) { alert("Valitse molemmat päivämäärät."); return; }
            const start = new Date(startStr).setHours(0,0,0,0);
            const end = new Date(endStr).setHours(23,59,59,999);

            const filtered = history.filter(h => {
                const parts = h.date.split('.');
                const d = new Date(parts[2], parts[1]-1, parts[0]).getTime();
                return d >= start && d <= end;
            });
            alert(`Löytyi ${filtered.length} merkintää valitulla aikavälillä.`);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }

        function startTimer() {
            clearInterval(shiftTimerInterval);
            shiftTimerInterval = setInterval(() => {
                if(!shiftStartTime) return;
                const diff = Date.now() - shiftStartTime; // Laske ero valittuun aloitusaikaan
                
                // Estä negatiiviset luvut (jos aika asetettu tulevaisuuteen)
                if (diff < 0) {
                    document.getElementById('shift-timer').innerText = "Odottaa aloitusta...";
                    return;
                }

                const hours = Math.floor(diff / 3600000);
                const minutes = Math.floor((diff % 3600000) / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                document.getElementById('shift-timer').innerText = 
                    `Kesto: ${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }, 1000);
        }

        function pad(n) { return n < 10 ? '0'+n : n; }
        function playAlert() { try { alertSound.play(); } catch(e) {} }
        function saveHistory() { localStorage.setItem('shiftHistory', JSON.stringify(history)); }
        function saveState() { localStorage.setItem('cardVal', cardInput.value); localStorage.setItem('gradeVal', gradeInput.value); }
        function restoreState() { if(localStorage.getItem('cardVal')) cardInput.value = localStorage.getItem('cardVal'); if(localStorage.getItem('gradeVal')) gradeInput.value = localStorage.getItem('gradeVal'); }
        function exportCSV() {
            let csv = "Pvm,Kello,Kortti,Laji,Tapahtuma,Tyyppi\n";
            history.forEach(row => { csv += `${row.date},${row.time},${row.card},${row.grade},${row.action},${row.type}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `tyovuorot_${new Date().toISOString().slice(0,10)}.csv`; a.click();
        }
    </script>
</body>
</html>
