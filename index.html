<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FF6700">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PBPro">
    
    <title>Press Brake Pro v5.7 AI</title>
    
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'></script>

    <style>
        :root { 
            --bg: #0a0a0a; --card: #141414; 
            --primary: #FF6700; --success: #00e676; --danger: #ff1744;
            --text-light: #f5f5f5; --text-muted: #888; 
        }
        
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; background: var(--bg); color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* Versio-rivi (Pyynnöstä vihreä ja selkeä) */
        .version-tag {
            color: #00e676; font-weight: 800; font-size: 1.1em;
            text-align: center; padding: 10px; background: #111;
            border-bottom: 1px solid #333;
        }
        
        .container { max-width: 480px; margin: 0 auto; padding: 15px; padding-bottom: 100px; }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .dash-box { 
            background: #1a1a1a; padding: 15px; border-radius: 16px; 
            text-align: center; border: 1px solid #333; 
        }
        .dash-val { font-size: 2em; font-weight: 800; color: #fff; display: block; }
        .dash-lbl { font-size: 0.65em; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }

        /* Honor-optimoitu skannausnappi */
        .btn-scan-ai {
            width: 100%; padding: 20px; border-radius: 16px; border: 2px solid var(--success);
            background: linear-gradient(145deg, #1a4a1a 0%, #0a2a0a 100%);
            color: var(--success); font-weight: 800; font-size: 1.1em;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px;
            box-shadow: 0 4px 15px rgba(0, 230, 118, 0.2);
            margin-bottom: 20px;
        }

        .info-row { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .info-box { 
            background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center;
        }
        .info-box span { font-size: 0.75em; color: #777; font-weight: 700; text-transform: uppercase; }
        .info-box b { font-size: 1.2em; color: var(--primary); }

        .main-btn {
            width: 100%; padding: 18px; border-radius: 14px; border: none;
            font-size: 1em; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-bottom: 10px;
        }
        .btn-save { background: var(--primary); color: white; }
        .btn-start { background: var(--success); color: black; }
        .btn-stop { background: var(--danger); color: white; }

        /* Kamera-kerros */
        #camera-overlay {
            display: none; position: fixed; inset: 0; background: #000; z-index: 9999;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .video-wrapper {
            width: 90%; height: 50%; border: 2px solid var(--success); border-radius: 15px;
            overflow: hidden; position: relative; background: #111;
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        
        .scan-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: var(--success); box-shadow: 0 0 15px var(--success);
            animation: scan 2s infinite linear;
        }
        @keyframes scan { from { top: 0; } to { top: 100%; } }

        /* Numpad */
        #numpad-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 85%; }
        .key { 
            background: #222; padding: 25px; border-radius: 12px; text-align: center;
            font-size: 1.8em; font-weight: 800; border: 1px solid #333; color: white;
        }
        .key:active { background: var(--primary); }

        .hist-list { background: #050505; border-radius: 12px; border: 1px solid #222; max-height: 250px; overflow-y: auto; }
        .hist-item { display: grid; grid-template-columns: 80px 1fr 60px; padding: 12px; border-bottom: 1px solid #111; font-size: 0.85em; }

        .install-btn {
            background: #222; color: #888; border: 1px dashed #444; padding: 10px;
            width: 100%; border-radius: 10px; font-size: 0.8em; margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="version-tag">v5.7 PBPRO AI-VISION • HONOR OPTIMIZED</div>

<div class="container">
    <div class="dashboard">
        <div class="dash-box">
            <span class="dash-lbl">Vuoron kesto</span>
            <span id="txt-timer" class="dash-val">00:00</span>
        </div>
        <div class="dash-box">
            <span class="dash-lbl">Efficiency</span>
            <span id="txt-eff" class="dash-val">0.00</span>
        </div>
    </div>

    <button id="btn-scan-trigger" class="btn-scan-trigger btn-scan-ai">
        📷 SKANNAA KORTTI (AI)
    </button>

    <div class="info-row">
        <div class="info-box" onclick="openPad('kortti')"><span>Työnumero</span><b id="val-kortti">-</b></div>
        <div class="info-box" onclick="askLajike()"><span>Lajimerkki</span><b id="val-lajike">-</b></div>
        <div class="info-box" onclick="openPad('asetus')"><span>Asetus (min)</span><b id="val-asetus">-</b></div>
        <div class="info-box" onclick="openPad('taivutus')"><span>Taivutus (min)</span><b id="val-taivutus">-</b></div>
    </div>

    <button id="btn-save" class="main-btn btn-save">💾 TALLENNA KORTTI</button>
    <button id="btn-shift" class="main-btn btn-start">ALOITA VUORO</button>

    <div class="hist-list" id="hist-list"></div>
    
    <button onclick="resetApp()" class="install-btn">NOLLAA HISTORIA</button>
    <button id="pwa-install" class="install-btn" style="display:none">ASENNA SOVELLUKSENA (WPA)</button>
</div>

<div id="camera-overlay">
    <div class="video-wrapper">
        <video id="video" playsinline></video>
        <div class="scan-line"></div>
    </div>
    <p id="scan-feedback" style="color:#aaa; margin-top:15px; font-weight:bold;">Etsitään työkoodia...</p>
    <button onclick="stopCamera()" style="background:var(--danger); color:white; padding:15px 40px; border-radius:30px; border:none; font-weight:800; margin-top:20px;">PERUUTA</button>
</div>

<div id="numpad-overlay">
    <div id="pad-display" style="color:var(--primary); font-size:3em; font-weight:800; margin-bottom:20px; font-family:monospace;"></div>
    <div class="numpad-grid" id="keys"></div>
    <button onclick="closePad()" style="margin-top:25px; background:none; border:none; color:#666; font-weight:800;">SULJE</button>
</div>

<script>
const State = {
    shiftRunning: false,
    startTime: null,
    padTarget: '',
    padBuffer: '',
    history: JSON.parse(localStorage.getItem('pbpro_v57') || '[]')
};

// --- HONOR MAGIC 5 LITE OPTIMIOITU KAMERA ---
async function startCamera() {
    const video = document.getElementById('video');
    const feedback = document.getElementById('scan-feedback');
    document.getElementById('camera-overlay').style.display = 'flex';

    const constraints = {
        video: {
            facingMode: 'environment',
            focusMode: 'continuous',
            width: { ideal: 1280 },
            height: { ideal: 720 }
        }
    };

    try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.setAttribute("playsinline", true); // Honor/Android vaatii
        video.play();
        
        // AI-Analyysi sykli
        window.scanInterval = setInterval(() => analyzeFrame(), 1500);
        feedback.innerText = "ML-VISION AKTIIVINEN";
        feedback.style.color = "var(--success)";
    } catch (err) {
        alert("Virhe: Kameraa ei voitu avata. Varmista HTTPS ja luvat.");
        stopCamera();
    }
}

function stopCamera() {
    const video = document.getElementById('video');
    if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
    }
    clearInterval(window.scanInterval);
    document.getElementById('camera-overlay').style.display = 'none';
}

async function analyzeFrame() {
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    const { data: { text } } = await Tesseract.recognize(canvas, 'fin');
    
    // Etsitään 6-numeroinen luku (ML Kit logiikka)
    const match = text.match(/\b\d{6}\b/);
    if (match) {
        document.getElementById('val-kortti').textContent = match[0];
        if(navigator.vibrate) navigator.vibrate(100);
        stopCamera();
    }
}

// --- LOGIIKKA JA NUMPAD ---
function openPad(target) {
    State.padTarget = target;
    State.padBuffer = '';
    document.getElementById('pad-display').innerText = '-';
    document.getElementById('numpad-overlay').style.display = 'flex';
    
    const grid = document.getElementById('keys');
    grid.innerHTML = '';
    for(let i=1; i<=9; i++) grid.innerHTML += `<div class="key" onclick="press(${i})">${i}</div>`;
    grid.innerHTML += `<div class="key" onclick="State.padBuffer=''; document.getElementById('pad-display').innerText='-';">C</div>`;
    grid.innerHTML += `<div class="key" onclick="press(0)">0</div>`;
    grid.innerHTML += `<div class="key" style="background:var(--success); color:black" onclick="savePad()">OK</div>`;
}

function press(n) {
    // KORTIN NUMERO RAJOITUS: 6 numeroa
    if (State.padTarget === 'kortti' && State.padBuffer.length >= 6) return;
    State.padBuffer += n;
    document.getElementById('pad-display').innerText = State.padBuffer;
}

function savePad() {
    const val = State.padBuffer;
    if (State.padTarget === 'kortti') {
        if (val.length !== 6) { alert("Työnumeron oltava 6 numeroa!"); return; }
        document.getElementById('val-kortti').innerText = val;
    } else {
        document.getElementById('val-' + State.padTarget).innerText = val + ' min';
    }
    closePad();
}

function closePad() { document.getElementById('numpad-overlay').style.display = 'none'; }

function askLajike() {
    let val = prompt("Syötä lajimerkki:");
    if (val) {
        // AUTOMAATTINEN MUUNNOS ISOIKSI
        document.getElementById('val-lajike').innerText = val.toUpperCase();
    }
}

// --- SHIFT & SAVE ---
function toggleShift() {
    const btn = document.getElementById('btn-shift');
    if (!State.shiftRunning) {
        State.shiftRunning = true;
        State.startTime = Date.now();
        btn.innerText = "LOPETA VUORO";
        btn.className = "main-btn btn-stop";
        if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
    } else {
        State.shiftRunning = false;
        btn.innerText = "ALOITA VUORO";
        btn.className = "main-btn btn-start";
    }
}

function saveKortti() {
    const nr = document.getElementById('val-kortti').innerText;
    if (nr === "-" || nr.length !== 6) { alert("Syötä 6-numeroinen työnumero!"); return; }

    const entry = {
        id: Date.now(),
        nr: nr,
        laji: document.getElementById('val-lajike').innerText,
        min: parseInt(document.getElementById('val-asetus').innerText || 0) + 
             parseInt(document.getElementById('val-taivutus').innerText || 0),
        ts: new Date().toLocaleTimeString('fi-FI', {hour:'2-digit', minute:'2-digit'})
    };

    State.history.unshift(entry);
    localStorage.setItem('pbpro_v57', JSON.stringify(State.history));
    
    // Nollaa kentät
    ['val-kortti','val-lajike','val-asetus','val-taivutus'].forEach(id => document.getElementById(id).innerText = "-");
    renderHistory();
}

function renderHistory() {
    document.getElementById('hist-list').innerHTML = State.history.slice(0, 10).map(e => `
        <div class="hist-item">
            <b style="color:var(--primary)">${e.nr}</b>
            <span style="color:#aaa">${e.laji}</span>
            <span style="text-align:right; font-weight:bold;">${e.min}m</span>
        </div>
    `).join('');
}

function resetApp() {
    if (confirm("Haluatko varmasti nollata koko jakson historian?")) {
        State.history = [];
        localStorage.removeItem('pbpro_v57');
        renderHistory();
    }
}

// --- TIMER JA EFFICIENCY ---
setInterval(() => {
    if (State.shiftRunning) {
        const diff = Date.now() - State.startTime;
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        document.getElementById('txt-timer').innerText = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
        
        const totalWorkMin = State.history.reduce((a, b) => a + b.min, 0);
        const elapsedMin = diff / 60000;
        document.getElementById('txt-eff').innerText = (totalWorkMin / (elapsedMin || 1)).toFixed(2);
    }
}, 1000);

// --- PWA ASENNUS LOGIIKKA ---
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    const installBtn = document.getElementById('pwa-install');
    installBtn.style.display = 'block';
    installBtn.onclick = () => e.prompt();
});

document.getElementById('btn-scan-trigger').onclick = startCamera;
document.getElementById('btn-save').onclick = saveKortti;
document.getElementById('btn-shift').onclick = toggleShift;
renderHistory();

</script>
</body>
</html>
