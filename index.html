<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>PBPro v21.8</title>
    <style>
        :root { --bg: #0a0a0a; --primary: #FF6700; --success: #00e676; --danger: #ff1744; --openai: #74aa9c; }
        body { margin: 0; background: var(--bg); color: #f5f5f5; font-family: sans-serif; text-align: center; }
        .version-tag { color: #fff; font-weight: bold; padding: 10px; background: #6a1b9a; border-bottom: 2px solid #fff; font-size: 0.8em; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; padding-bottom: 120px; }
        .period-header { background: #111; padding: 15px; border-radius: 16px; border: 1px solid var(--openai); margin-bottom: 10px; position: relative; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .dash-box { background: #1a1a1a; padding: 12px; border-radius: 16px; border: 1px solid #333; }
        .dash-val { font-size: 1.5em; font-weight: 800; color: var(--success); }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; text-align: left; }
        .info-box { background: #111; padding: 12px; border-radius: 12px; border: 1px solid #333; cursor: pointer; min-height: 45px; }
        .info-box span { font-size: 0.65em; color: #888; display: block; text-transform: uppercase; }
        .info-box b { color: var(--primary); font-size: 1.05em; display: block; word-break: break-all; }
        .btn-scan { width: 100%; padding: 25px; border-radius: 16px; border: 3px solid var(--openai); background: #0a1a15; color: var(--openai); font-weight: 900; font-size: 1.2em; cursor: pointer; margin-bottom: 20px; }
        .main-btn { width: 100%; padding: 18px; border-radius: 14px; border: none; font-size: 1.1em; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; cursor: pointer; }
        #cam-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; flex-direction: column; }
        #focus-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75vw; height: calc(75vw * 1.41); border: 2px dashed var(--openai); border-radius: 10px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.7); pointer-events: none; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .hist-item { background: #1a1a1a; padding: 12px; margin-bottom: 8px; border-radius: 12px; text-align: left; border-left: 4px solid var(--primary); }
    </style>
</head>
<body>

<div class="version-tag">v21.8 • DESCRIPTION FIELD ENABLED</div>

<div class="container">
    <div class="period-header">
        <span style="position:absolute;top:10px;right:10px;color:#444;font-size:0.7em;" onclick="resetAll()">nollaa</span>
        <div id="txt-period-dates" style="font-size:0.85em; color:var(--openai); font-weight:bold;">JAKSO: -</div>
        <div style="display:flex; justify-content:space-around; margin-top:10px;">
            <div><small style="color:#888;">Kerroin</small><br><span id="txt-period-pace" style="font-size:1.6em; font-weight:900; color:var(--openai);">0.00</span></div>
            <div><small style="color:#888;">Tunnit</small><br><span id="txt-period-hours" style="font-size:1.6em; font-weight:900;">0.0</span></div>
        </div>
    </div>
    
    <div class="dashboard">
        <div class="dash-box"><small style="color:#888;">VUORON h</small><br><span id="txt-timer" class="dash-val">0.00</span></div>
        <div class="dash-box"><small style="color:#888;">JOUTUISUUS</small><br><span id="txt-shift-pace" class="dash-val">0.00</span></div>
    </div>

    <button id="btn-open-camera" class="btn-scan">📸 SKANNAA KORTTI</button>
    
    <div class="info-grid">
        <div class="info-box" onclick="editV('val-tyonr', 'Työnumero')"><span>Työnumero</span><b id="val-tyonr">-</b></div>
        <div class="info-box" onclick="editV('val-lajike', 'Tuote (Koodi)')"><span>Tuote</span><b id="val-lajike">-</b></div>
        <div class="info-box" style="grid-column: span 2;" onclick="editV('val-kuvaus', 'Sanallinen kuvaus')"><span>Kuvaus</span><b id="val-kuvaus">-</b></div>
        <div class="info-box" onclick="editV('val-piirnro', 'Piirustus nro')"><span>Piirustus</span><b id="val-piirnro">-</b></div>
        <div class="info-box" onclick="editV('val-asiakas', 'Asiakas')"><span>Asiakas</span><b id="val-asiakas">-</b></div>
        <div class="info-box" onclick="editV('val-asetusaika', 'Asetus (min)')"><span>Asetus</span><b id="val-asetusaika">-</b></div>
        <div class="info-box" onclick="editV('val-taivutusaika', 'Taivutus (min)')"><span>Taivutus</span><b id="val-taivutusaika">-</b></div>
    </div>

    <button id="btn-save" style="background:var(--primary); color:white" class="main-btn">💾 TALLENNA HISTORIAAN</button>
    <button id="btn-start-shift" style="background:var(--success); color:black" class="main-btn">ALOITA VUORO</button>
    <button id="btn-stop-shift" style="background:var(--danger); color:white; display:none;" class="main-btn">LOPETA VUORO</button>
    
    <div id="hist-list" style="margin-top:20px;"></div>
</div>

<div id="loader"><p>Poimitaan tietoja ja kuvausta...</p></div>

<div id="cam-overlay">
    <video id="video" style="width:100%; height:100%; object-fit:cover;" playsinline muted></video>
    <div id="focus-frame"></div>
    <div style="position:absolute; bottom:40px; width:100%; text-align:center;">
        <button id="snap" style="width:80px; height:80px; border-radius:50%; background:white; border:8px solid var(--openai);"></button>
        <br><br>
        <button onclick="closeCam()" style="color:white; background:none; border:none; font-weight:bold;">PERUUTA</button>
    </div>
</div>

<script>
let State = {
    startTime: localStorage.getItem('pb_start') ? new Date(parseInt(localStorage.getItem('pb_start'))) : null,
    history: JSON.parse(localStorage.getItem('pbpro_master_history') || '[]'),
    stream: null
};

function saveToDisk() {
    localStorage.setItem('pbpro_master_history', JSON.stringify(State.history));
    if(State.startTime) localStorage.setItem('pb_start', State.startTime.getTime());
    else localStorage.removeItem('pb_start');
}

function cleanNumeric(str) {
    if (!str) return "0";
    return str.replace(',', '.').replace(/[^0-9.]/g, '') || "0";
}

document.getElementById('btn-open-camera').onclick = async () => {
    try {
        State.stream = await navigator.mediaDevices.getUserMedia({video: {facingMode:"environment", width: 1920}});
        document.getElementById('video').srcObject = State.stream;
        document.getElementById('cam-overlay').style.display='flex';
        document.getElementById('video').play();
    } catch(e) { alert("Kamera-oikeus tarvitaan."); }
};

function closeCam() { if(State.stream) State.stream.getTracks().forEach(t=>t.stop()); document.getElementById('cam-overlay').style.display='none'; }

document.getElementById('snap').onclick = async () => {
    const v = document.getElementById('video'), c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const b64 = c.toDataURL('image/jpeg', 0.9);
    closeCam();
    document.getElementById('loader').style.display='flex';
    
    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('openai_api_key') },
            body: JSON.stringify({
                model: "gpt-4o",
                messages: [{ role: "user", content: [
                    { type: "text", text: "Analysoi A4-työkortti: 1. Työnumero (6 nro). 2. Tuote (koodi ylhäällä vasemmalla). 3. Kuvaus (sanallinen nimi heti koodin alla, esim. Tuuletinsuoja). 4. Piirustusnro. 5. Asiakas. 6. SÄRMÄYS-rivi: Asetus ja Kapasiteettiaika (vain luvut). JSON: {\"tyo\":\"...\",\"laji\":\"...\",\"kuvaus\":\"...\",\"piir\":\"...\",\"asia\":\"...\",\"asetus\":\"...\",\"taivutus\":\"...\"}" },
                    { type: "image_url", image_url: { url: b64 } }
                ]}]
            })
        });
        const d = await response.json();
        const res = JSON.parse(d.choices[0].message.content.match(/\{.*\}/s)[0]);
        
        document.getElementById('val-tyonr').innerText = res.tyo || "-";
        document.getElementById('val-lajike').innerText = (res.laji || "-").toUpperCase();
        document.getElementById('val-kuvaus').innerText = (res.kuvaus || "-").toUpperCase();
        document.getElementById('val-piirnro').innerText = res.piir || "-";
        document.getElementById('val-asiakas').innerText = res.asia || "-";
        document.getElementById('val-asetusaika').innerText = cleanNumeric(res.asetus);
        document.getElementById('val-taivutusaika').innerText = cleanNumeric(res.taivutus);
    } catch(e) { alert("Virhe luvussa."); }
    finally { document.getElementById('loader').style.display='none'; }
};

document.getElementById('btn-save').onclick = () => {
    const tyo = document.getElementById('val-tyonr').innerText;
    if(tyo === "-" || tyo.length < 5) return alert("Ei tallennettavaa.");
    const kpl = prompt("Kpl-määrä?", "1");
    if(!kpl) return;
    
    const entry = {
        id: Date.now(),
        pvm: new Date().toLocaleDateString('fi-FI'),
        tyo,
        tuote: document.getElementById('val-lajike').innerText,
        kuvaus: document.getElementById('val-kuvaus').innerText,
        kpl,
        sumMins: parseFloat(document.getElementById('val-asetusaika').innerText) + (parseFloat(document.getElementById('val-taivutusaika').innerText) * parseInt(kpl))
    };
    
    State.history.unshift(entry);
    saveToDisk();
    renderHistory();
};

function renderHistory() {
    document.getElementById('hist-list').innerHTML = State.history.slice(0, 10).map(e => `
        <div class="hist-item">
            <b>${e.tyo}</b> | ${e.tuote}<br>
            <small>${e.kuvaus} • ${e.kpl} kpl • ${e.sumMins.toFixed(1)} min</small>
        </div>
    `).join('');
}

document.getElementById('btn-start-shift').onclick = () => { State.startTime = new Date(); saveToDisk(); updateUI(); };
document.getElementById('btn-stop-shift').onclick = () => { if(confirm("Lopetetaanko vuoro?")) { State.startTime = null; saveToDisk(); updateUI(); } };
function resetAll() { if(confirm("Nollataanko koko jakso?")) { State.history=[]; saveToDisk(); renderHistory(); } }
function editV(id, msg) { let v = prompt(msg, document.getElementById(id).innerText); if(v!==null) document.getElementById(id).innerText=v.toUpperCase(); }
function updateUI() { /* Mittarit kuten v21.7 */ }
setInterval(updateUI, 5000); updateUI(); renderHistory();
</script>
</body>
</html>
