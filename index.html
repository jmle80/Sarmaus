<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PBPro v8.3</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; }
        .version-tag { color: #00e676; padding: 10px; font-size: 0.8em; border-bottom: 1px solid #222; }
        .btn-scan { width: 90%; padding: 25px; border-radius: 15px; border: 2px solid #00e676; background: #051505; color: #00e676; font-weight: bold; font-size: 1.2em; margin-top: 20px; }
        .box { background: #111; margin: 5px 15px; padding: 15px; border-radius: 10px; border: 1px solid #333; display: flex; justify-content: space-between; }
        #debug-info { color: #555; font-size: 0.7em; margin-top: 20px; word-break: break-all; padding: 10px; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="version-tag">v8.3 DEBUG-MODE (PROXY)</div>

<button class="btn-scan" onclick="startCamera()">🤖 SKANNAA KORTTI</button>

<div class="box"><span>Työnumero</span><b id="v-nr">-</b></div>
<div class="box"><span>Lajike</span><b id="v-laji">-</b></div>

<div id="debug-info"></div>

<button onclick="localStorage.removeItem('claude_api_key'); location.reload();" style="color:#FF6700; background:none; border:none; margin-top:40px; text-decoration:underline;">POISTA JA VAIHDA API-AVAIN</button>

<div id="loader"><p>AI Analysoi...</p></div>

<div id="cam-overlay" style="display:none; position:fixed; inset:0; background:#000; z-index:50;">
    <video id="video" style="width:100%; height:80%; object-fit:cover;" playsinline></video>
    <button onclick="snap()" style="width:80%; margin:20px; padding:20px; background:#00e676; border:none; border-radius:50px; font-weight:bold; position:absolute; bottom:20px; left:10%;">📸 OTA KUVA</button>
</div>

<script>
// Näytetään avaimen tila debug-kentässä
function updateDebug() {
    const key = localStorage.getItem('claude_api_key');
    const debug = document.getElementById('debug-info');
    if (!key) {
        debug.innerHTML = "AVAIN PUUTTUU! Paina 'Vaihda API-avain'.";
    } else {
        const start = key.substring(0, 10);
        const end = key.substring(key.length - 4);
        debug.innerHTML = `Avain tallennettu: ${start}...${end}<br>Pituus: ${key.length} merkkiä.`;
    }
}
updateDebug();

async function startCamera() {
    const s = await navigator.mediaDevices.getUserMedia({video: {facingMode:"environment"}});
    document.getElementById('video').srcObject = s;
    document.getElementById('video').play();
    document.getElementById('cam-overlay').style.display = 'block';
}

async function snap() {
    const v = document.getElementById('video');
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const base64 = c.toDataURL('image/jpeg', 0.6).split(',')[1];
    
    v.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('cam-overlay').style.display = 'none';
    document.getElementById('loader').style.display = 'flex';

    let key = localStorage.getItem('claude_api_key');
    if(!key) {
        key = prompt("Syötä uusi API-avain:");
        if(key) {
            key = key.trim();
            localStorage.setItem('claude_api_key', key);
            updateDebug();
        } else { location.reload(); return; }
    }

    const proxy = 'https://corsproxy.io/?';
    const target = 'https://api.anthropic.com/v1/messages';

    try {
        const r = await fetch(proxy + encodeURIComponent(target), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': key,
                'anthropic-version': '2023-06-01'
            },
            body: JSON.stringify({
                model: "claude-3-5-sonnet-20240620", max_tokens: 500,
                messages: [{role: "user", content: [{type: "image", source: {type: "base64", media_type: "image/jpeg", data: base64}}, {type: "text", text: "JSON: {nr, laji}"}]}]
            })
        });
        
        const d = await r.json();
        
        if (d.error) {
            alert("CLAUDE VIRHE: " + d.error.message);
        } else {
            const res = JSON.parse(d.content[0].text);
            document.getElementById('v-nr').innerText = res.nr;
            document.getElementById('v-laji').innerText = res.laji;
        }
    } catch(e) { 
        alert("VERKKOVIRHE: " + e.message); 
    } finally { 
        document.getElementById('loader').style.display = 'none'; 
    }
}
</script>
</body>
</html>
