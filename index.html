<script>
// ... (muu koodi säilyy ennallaan, päivitä snap-funktio alta) ...

document.getElementById('snap').onclick = async () => {
    const v = document.getElementById('video'), c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const b64 = c.toDataURL('image/jpeg', 0.6).split(',')[1];
    v.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('cam-overlay').style.display = 'none';
    document.getElementById('loader').style.display = 'flex';

    const key = localStorage.getItem('openai_api_key');

    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [{
                    role: "user",
                    content: [
                        { 
                          type: "text", 
                          text: "Lue sarmouskortista tiedot. OHJEET: 1. Työnumero on 6 numeroa. 2. Asetusaika löytyy sanan 'asetus' alapuolelta. 3. Taivutusaika (esim 4,65) löytyy sanan 'kapasiteetti' alapuolelta vaiheesta 2 taivutus. 4. Piirustusnumero ja Asiakas ovat tekstiä. Palauta vain JSON: {\"tyo\":\"...\",\"piir\":\"...\",\"asia\":\"...\",\"laji\":\"...\",\"asetus\":\"...\",\"taivutus\":\"...\"}" 
                        },
                        { type: "image_url", image_url: { url: `data:image/jpeg;base64,${b64}` } }
                    ]
                }]
            })
        });

        const d = await response.json();
        const content = d.choices[0].message.content;
        const res = JSON.parse(content.match(/\{.*\}/s)[0]);
        
        // Sijoitetaan tiedot laatikoihin
        document.getElementById('val-tyonr').innerText = res.tyo || "-";
        document.getElementById('val-piirnro').innerText = res.piir || "-";
        document.getElementById('val-asiakas').innerText = res.asia || "-";
        document.getElementById('val-lajike').innerText = (res.laji || "-").toUpperCase();
        document.getElementById('val-asetusaika').innerText = res.asetus || "-";
        document.getElementById('val-taivutusaika').innerText = res.taivutus || "-";

    } catch(e) { 
        alert("Skannaus ei palauttanut tietoja. Tarkista kuvan laatu."); 
    } finally { 
        document.getElementById('loader').style.display = 'none'; 
    }
};
</script>
