<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PBPro v12.1</title>
    <style>
        :root { --bg: #0a0a0a; --primary: #FF6700; --success: #00e676; --danger: #ff1744; --openai: #74aa9c; --info: #4285f4; }
        body { margin: 0; background: var(--bg); color: #f5f5f5; font-family: sans-serif; text-align: center; }
        .version-tag { color: var(--openai); font-weight: bold; padding: 10px; background: #111; border-bottom: 1px solid #333; font-size: 0.8em; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; padding-bottom: 100px; }
        
        /* Aikalaatikot */
        .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .time-box { background: #1a1a1a; padding: 12px; border-radius: 12px; border: 1px solid #333; }
        .time-box span { font-size: 0.7em; color: #888; text-transform: uppercase; display: block; }
        .time-box b { font-size: 1.5em; color: var(--info); }
        .time-box.active b { color: var(--success); text-shadow: 0 0 10px var(--success); }

        .btn-scan { width: 100%; padding: 25px; border-radius: 16px; border: 3px solid var(--openai); background: #0a1a15; color: var(--openai); font-weight: 900; font-size: 1.2em; cursor: pointer; margin-bottom: 20px; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .info-box { background: #111; padding: 12px; border-radius: 12px; border: 1px solid #333; text-align: left; cursor: pointer; }
        .info-box span { font-size: 0.65em; color: #888; display: block; text-transform: uppercase; }
        .info-box b { color: var(--primary); font-size: 1.05em; word-break: break-all; }
        
        .main-btn { width: 100%; padding: 18px; border-radius: 14px; border: none; font-size: 1.1em; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; cursor: pointer; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        #cam-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; flex-direction: column; }
        .hist-item { background: #1a1a1a; padding: 12px; border-radius: 10px; margin-bottom: 8px; border-left: 5px solid var(--primary); text-align: left; }
    </style>
</head>
<body>

<div class="version-tag">v12.1 TIME BOX EDITION</div>

<div class="container">
    <div class="time-grid">
        <div id="box-asetus" class="time-box"><span>Asetusaika</span><b id="txt-asetus">0 min</b></div>
        <div id="box-taivutus" class="time-box"><span>Taivutusaika</span><b id="txt-taivutus">0 min</b></div>
    </div>

    <button id="btn-open-camera" class="btn-scan">📸 SKANNAA KORTTI</button>
    
    <div class="info-grid">
        <div class="info-box" onclick="manualInput('tyonr')"><span>Työnumero (6 nro)</span><b id="val-tyonr">-</b></div>
        <div class="info-box" onclick="manualInput('piirnro')"><span>Piirustus nro</span><b id="val-piirnro">-</b></div>
        <div class="info-box" onclick="manualInput('asiakas')"><span>Asiakas</span><b id="val-asiakas">-</b></div>
        <div class="info-box" onclick="manualInput('lajike')"><span>Lajimerkki</span><b id="val-lajike">-</b></div>
    </div>

    <button id="btn-save" style="background:var(--primary); color:white" class="main-btn">💾 TALLENNA JA LOPETA</button>
    <button id="btn-shift" style="background:var(--success); color:black" class="main-btn">ALOITA VUORO</button>
    
    <div style="margin-top:25px;">
        <h3 style="text-align:left; font-size:1em; color:#999;">HISTORIA</h3>
        <div id="hist-list"></div>
    </div>
</div>

<div id="loader"><p id="status-text">OpenAI analysoi...</p></div>
<div id="cam-overlay"><video id="video" style="width:100%; height:75%; object-fit:cover;" playsinline></video><button id="snap" style="width:80%; margin:20px auto; padding:20px; background:var(--openai); color:white; border:none; border-radius:50px; font-weight:bold; font-size:1.2em;">OTA KUVA</button></div>

<script>
let State = { 
    running: false, 
    startTime: null, 
    lastSaveTime: null, 
    asetusValmis: false,
    history: JSON.parse(localStorage.getItem('pbpro_v121_hist') || '[]') 
};

// --- SKANNAUS ---
document.getElementById('snap').onclick = async () => {
    // ... kameran sulku ja loader päälle ...
    const v = document.getElementById('video'), c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const b64 = c.toDataURL('image/jpeg', 0.6);
    v.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('cam-overlay').style.display = 'none';
    document.getElementById('loader').style.display = 'flex';

    const key = localStorage.getItem('openai_api_key');

    try {
        const r = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
            body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [{
                    role: "user",
                    content: [
                        { type: "text", text: "Extract exactly: 1. 'tyonr' (ONLY 6-digit numbers), 2. 'piirnro' (Drawing ID), 3. 'asiakas' (Customer name), 4. 'laji' (Material/Type). Return ONLY JSON: {\"tyonr\":\"...\",\"piirnro\":\"...\",\"asiakas\":\"...\",\"laji\":\"...\"}" },
                        { type: "image_url", image_url: { url: b64 } }
                    ]
                }]
            })
        });
        const d = await r.json();
        const res = JSON.parse(d.choices[0].message.content.match(/\{.*\}/s)[0]);
        
        // Puhdistus ettei tiedot sekoitu
        document.getElementById('val-tyonr').innerText = res.tyonr.replace(/\D/g, "").substring(0,6) || "-";
        document.getElementById('val-piirnro').innerText = res.piirnro || "-";
        document.getElementById('val-asiakas').innerText = res.asiakas || "-";
        document.getElementById('val-lajike').innerText = res.laji.toUpperCase() || "-";
        
        // Automaattinen asetusajan alkaminen skannauksesta
        if(State.running) { State.lastSaveTime = Date.now(); State.asetusValmis = false; }
    } catch(e) { alert("Skannaus epäonnistui"); }
    finally { document.getElementById('loader').style.display = 'none'; }
};

// --- AIKALASKENTA ---
setInterval(() => {
    if (State.running && State.lastSaveTime) {
        const diffMin = Math.floor((Date.now() - State.lastSaveTime) / 60000);
        
        // Jos oletetaan että asetus on aina ensimmäiset 5 min tai kunnes tallennetaan
        if (!State.asetusValmis) {
            document.getElementById('txt-asetus').innerText = diffMin + " min";
            document.getElementById('box-asetus').classList.add('active');
            document.getElementById('box-taivutus').classList.remove('active');
            if (diffMin >= 5) State.asetusValmis = true; // Esimerkki: asetus vaihtuu taivutukseksi 5min jälkeen
        } else {
            document.getElementById('txt-taivutus').innerText = (diffMin - 5) + " min";
            document.getElementById('box-taivutus').classList.add('active');
            document.getElementById('box-asetus').classList.remove('active');
        }
    }
}, 1000);

document.getElementById('btn-shift').onclick = function() {
    if(!State.running) {
        State.running = true; State.startTime = Date.now(); State.lastSaveTime = Date.now();
        this.innerText = "LOPETA VUORO"; this.style.background = "var(--danger)";
    } else {
        State.running = false; this.innerText = "ALOITA VUORO"; this.style.background = "var(--success)";
    }
};

document.getElementById('btn-save').onclick = () => {
    if(!State.running) return;
    const now = Date.now();
    const kesto = Math.round((now - State.lastSaveTime) / 60000);
    
    State.history.unshift({
        tyo: document.getElementById('val-tyonr').innerText,
        asia: document.getElementById('val-asiakas').innerText,
        piir: document.getElementById('val-piirnro').innerText,
        time: new Date().toLocaleTimeString('fi-FI', {hour:'2-digit', minute:'2-digit'}),
        kesto: kesto
    });
    
    localStorage.setItem('pbpro_v121_hist', JSON.stringify(State.history));
    State.lastSaveTime = now;
    State.asetusValmis = false;
    renderHistory();
};

function renderHistory() {
    document.getElementById('hist-list').innerHTML = State.history.slice(0, 10).map(e => `
        <div class="hist-item">
            <b>${e.asia}</b> | ${e.tyo} <span style="float:right">${e.kesto} min</span><br>
            <small>Piir: ${e.piir} | ${e.time}</small>
        </div>
    `).join('');
}

function manualInput(id) {
    let v = prompt("Arvo:"); if(v) document.getElementById('val-'+id).innerText = (id==='lajike'?v.toUpperCase():v);
}
renderHistory();
</script>
</body>
</html>
