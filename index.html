<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FF6700">
    <title>Press Brake Pro v5.9 AI</title>
    
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js'></script>

    <style>
        :root { --bg: #0a0a0a; --primary: #FF6700; --success: #00e676; }
        body { margin: 0; background: var(--bg); color: #f5f5f5; font-family: sans-serif; }
        
        .version-tag { color: #00e676; font-weight: 800; text-align: center; padding: 10px; background: #111; font-size: 0.9em; border-bottom: 1px solid #333; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }

        .btn-scan-ai {
            width: 100%; padding: 20px; border-radius: 16px; border: 2px solid var(--success);
            background: #111; color: var(--success); font-weight: 800; font-size: 1.1em;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        /* Kameranäkymä ja kohdistuslaatikko */
        #camera-overlay {
            display: none; position: fixed; inset: 0; background: #000; z-index: 9999;
            flex-direction: column; align-items: center;
        }
        .video-wrapper {
            width: 90%; height: 40%; border-radius: 15px; margin-top: 50px;
            overflow: hidden; position: relative; border: 1px solid #444;
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        
        .focus-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 250px; height: 80px; border: 2px solid var(--success);
            box-shadow: 0 0 0 2000px rgba(0,0,0,0.5); border-radius: 5px;
        }
        .focus-box::after {
            content: "ASETA 6-NUMEROINEN KOODI TÄHÄN"; position: absolute; top: -25px;
            width: 100%; text-align: center; color: var(--success); font-size: 0.6em; font-weight: bold;
        }

        .info-box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .info-box b { color: var(--primary); font-size: 1.2em; }

        .main-btn { width: 100%; padding: 18px; border-radius: 14px; border: none; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; }
        .btn-save { background: var(--primary); color: white; }
        .btn-start { background: var(--success); color: black; }
    </style>
</head>
<body>

<div class="version-tag">v5.9 • AI-SCAN ACTIVE</div>

<div class="container">
    <button id="btn-scan-trigger" class="btn-scan-ai">📷 SKANNAA KORTTI</button>
    
    <div style="margin: 20px 0;">
        <div class="info-box" onclick="openManual('kortti')"><span>Työnumero</span><b id="val-kortti">-</b></div>
        <div class="info-box" onclick="askLajike()"><span>Lajimerkki</span><b id="val-lajike">-</b></div>
        <div class="info-box" onclick="openManual('asetus')"><span>Asetus (min)</span><b id="val-asetus">-</b></div>
        <div class="info-box" onclick="openManual('taivutus')"><span>Taivutus (min)</span><b id="val-taivutus">-</b></div>
    </div>

    <button id="btn-save" class="main-btn btn-save">💾 TALLENNA KORTTI</button>
    <button id="btn-shift" class="main-btn btn-start">ALOITA VUORO</button>
</div>

<div id="camera-overlay">
    <div class="video-wrapper">
        <video id="video" playsinline></video>
        <div class="focus-box"></div>
    </div>
    <div id="scan-feedback" style="margin-top:20px; color:var(--success); font-weight:bold;">Analysoidaan...</div>
    <div style="font-size: 0.8em; color: #666; margin: 10px;">Pidä kortti paikallaan ja varmista hyvä valo</div>
    
    <button onclick="analyzeFrame()" style="background:#222; color:white; padding:15px; border-radius:10px; border:1px solid #444; margin-bottom:10px;">ANALYSOI NYT</button>
    <button onclick="stopCamera()" style="background:none; border:none; color:white; text-decoration:underline;">PERUUTA</button>
</div>

<script>
const State = {
    history: JSON.parse(localStorage.getItem('pbpro_v59') || '[]'),
    isScanning: false
};

// --- KAMERA JA OCR LOGIIKKA ---
async function startCamera() {
    const video = document.getElementById('video');
    document.getElementById('camera-overlay').style.display = 'flex';
    State.isScanning = true;

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment', focusMode: 'continuous' }
        });
        video.srcObject = stream;
        video.play();
        
        // Automaattinen skannaus 1.5 sekunnin välein
        loopScan();
    } catch (err) {
        alert("Kameran avaaminen epäonnistui. Varmista HTTPS ja luvat.");
        stopCamera();
    }
}

function stopCamera() {
    State.isScanning = false;
    const video = document.getElementById('video');
    if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('camera-overlay').style.display = 'none';
}

async function loopScan() {
    if (!State.isScanning) return;
    await analyzeFrame();
    setTimeout(loopScan, 1500);
}

async function analyzeFrame() {
    if (!State.isScanning) return;
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    const fb = document.getElementById('scan-feedback');
    
    // Optimoitu kuvan rajaus: poimitaan vain focus-boxin alue
    canvas.width = 400; canvas.height = 150;
    const ctx = canvas.getContext('2d');
    
    // Piirretään vain keskikohta videosta analyysiin (nopeuttaa ja tarkentaa)
    ctx.drawImage(video, video.videoWidth*0.2, video.videoHeight*0.4, video.videoWidth*0.6, video.videoHeight*0.2, 0, 0, 400, 150);
    
    fb.innerText = "Analysoidaan...";
    fb.style.color = "#FF6700";

    try {
        const { data: { text } } = await Tesseract.recognize(canvas, 'fin');
        // Etsitään 6 numeroa
        const match = text.replace(/\s/g, '').match(/\d{6}/);
        
        if (match) {
            document.getElementById('val-kortti').innerText = match[0];
            fb.innerText = "TUNNISTETTU!";
            fb.style.color = "var(--success)";
            if(navigator.vibrate) navigator.vibrate(100);
            setTimeout(stopCamera, 500);
        } else {
            fb.innerText = "Etsitään numeroita...";
            fb.style.color = "#888";
        }
    } catch (e) { console.error(e); }
}

// --- PERUSTOIMINNOT ---
function askLajike() {
    let l = prompt("Lajimerkki:");
    if(l) document.getElementById('val-lajike').innerText = l.toUpperCase();
}

function openManual(t) {
    let v = prompt("Syötä arvo:");
    if(v) {
        if(t === 'kortti' && v.length !== 6) { alert("Työnumeron oltava 6 numeroa!"); return; }
        document.getElementById('val-'+t).innerText = v + (t==='kortti'?'':' min');
    }
}

document.getElementById('btn-scan-trigger').onclick = startCamera;
document.getElementById('btn-save').onclick = () => {
    if(document.getElementById('val-kortti').innerText.length !== 6) return alert("6-numeroinen koodi puuttuu!");
    alert("Tallennettu!");
    // Tallennuslogiikka säilyy samana kuin aiemmin...
};
</script>
</body>
</html>
