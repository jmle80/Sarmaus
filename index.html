<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Press Brake Pro v3.5 - STABLE</title>
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* TYYLIT */
        :root { 
            --bg: #121212; --card: #1e1e1e; --dark-panel: #252525; 
            --primary: #FF6700; --accent: #FF8C33; --success: #00e676; 
            --warning: #ffea00; --danger: #ff1744; --special: #78909c; 
            --blue: #29b6f6; --text-light: #e0e0e0; --text-muted: #a0a0a0; 
            --tb-accent: #00e676; --tb-blue: #2979ff; 
        }
        
        * { box-sizing: border-box; touch-action: manipulation; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; padding: 10px; background: var(--bg); margin: 0; color: var(--text-light); -webkit-user-select: none; user-select: none; min-height: 100vh; }
        
        .container { background: var(--card); padding: 15px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 480px; margin: 0 auto; padding-bottom: 80px; position: relative; }
        .vamm-header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .vamm-logo { font-size: 1.8em; font-weight: 900; color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
        .vamm-sub { font-size: 0.9em; color: var(--text-muted); }

        /* DASHBOARD */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .dashboard-box { background: var(--dark-panel); color: var(--text-light); border-radius: 15px; padding: 15px 5px; text-align: center; border-left: 4px solid #555; box-shadow: 0 4px 10px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between; min-height: 120px; }
        .dash-title { font-size: 0.75em; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
        .dash-value { font-size: 2.5em; font-weight: 800; line-height: 1; text-shadow: 0 0 10px rgba(0,0,0,0.3); transition: color 0.5s; }
        .dash-sub-label { font-size: 0.7em; color: #aaa; margin-top: 5px; }
        .dash-sub-val { font-size: 1.1em; font-weight: bold; color: white; }
        .main-clock { font-size: 2.5em; font-weight: 700; font-family: 'Courier New', monospace; text-align: center; margin: 0 0 15px 0; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,0.5); background: #222; border-radius: 10px; padding: 5px; border: 1px solid #444; }

        /* TIMELINE */
        .timeline-wrapper { margin-bottom: 15px; background: #222; padding: 10px; border-radius: 12px; border: 1px solid #444; }
        .timeline-bar { display: flex; height: 25px; background: #333; border-radius: 12px; overflow: hidden; margin-bottom: 5px; }
        .seg { height: 100%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.7em; color: rgba(0,0,0,0.7); overflow: hidden; }
        .seg-asetus { background-color: var(--accent); } .seg-taivutus { background-color: var(--success); } .seg-muut { background-color: var(--warning); }
        .timeline-legend { display: flex; justify-content: space-around; font-size: 0.7em; color: #aaa; font-weight: bold; }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

        /* BOXES */
        .info-row { display: flex; gap: 10px; margin-bottom: 8px; }
        .info-box { flex-grow: 1; background: var(--dark-panel); padding: 12px; border-radius: 10px; border: 1px solid #555; border-left: 4px solid #ccc; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .info-box b { font-size: 1.1em; text-align: right; }
        .box-active { border-left-color: var(--primary); background: #3f4650; }
        .box-disabled { opacity: 0.5; pointer-events: none; background: #2a2e33; }
        .btn-scan { width: 50px; background: #393e46; border: 1px solid #555; border-radius: 10px; font-size: 1.5em; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-light); }

        .special-menu { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 10px; background: #222; padding: 10px; border-radius: 10px; }
        .btn-spec { padding: 10px; border: none; border-radius: 5px; background: var(--special); color: white; font-weight: bold; cursor: pointer; }
        .btn-spec.active { background: var(--danger); box-shadow: 0 0 5px red; }

        .main-action { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 12px; font-size: 1.1em; font-weight: 900; text-transform: uppercase; cursor: pointer; letter-spacing: 1px; display: block; }
        .btn-start { background: var(--success); color: #003300; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-save { background: var(--primary); color: white; }

        .hist-header { display: grid; grid-template-columns: 80px 1fr 60px; padding: 8px; background: #2c3e50; font-size: 0.75em; font-weight: bold; color: #ccc; border-radius: 10px 10px 0 0; margin-top: 10px; }
        .hist-cont { background: #2a2e33; max-height: 300px; overflow-y: auto; border: 1px solid #444; border-top: none; border-radius: 0 0 10px 10px; }
        .hist-item { display: grid; grid-template-columns: 80px 1fr 60px; padding: 10px 8px; border-bottom: 1px solid #444; font-size: 0.9em; align-items: center; }
        .date-divider { background: #111; color: var(--primary); padding: 4px; text-align: center; font-size: 0.75em; font-weight: bold; border-top: 1px solid #444; border-bottom: 1px solid #444; }

        .bottom-tools { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; border-top: 2px solid #444; padding-top: 15px; }
        .btn-tool { padding: 12px; background: #333; color: #aaa; border: 1px dashed #555; border-radius: 8px; cursor: pointer; width: 100%; font-weight:bold; }
        .btn-toolbox { background: linear-gradient(45deg, #2196F3, #21CBF3); color: white; border: none; box-shadow: 0 0 10px rgba(33, 203, 243, 0.3); border-style: solid; }
        
        .safety-wrapper { display: flex; align-items: center; justify-content: space-between; background: #222; padding: 10px; border-radius: 12px; margin-top: 20px; border: 1px solid #444; }
        .safety-label { font-weight: bold; color: #aaa; font-size: 0.9em; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; -webkit-transition: .4s; transition: .4s; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; -webkit-transition: .4s; transition: .4s; }
        input:checked + .slider { background-color: var(--primary); }
        input:focus + .slider { box-shadow: 0 0 1px var(--primary); }
        input:checked + .slider:before { -webkit-transform: translateX(22px); -ms-transform: translateX(22px); transform: translateX(22px); }
        .slider.round { border-radius: 34px; }
        .slider.round:before { border-radius: 50%; }

        .btn-hard-reset { background: #b71c1c; color: white; border: 2px solid #ff5252; font-weight: bold; padding: 15px; cursor: pointer; border-radius: 12px; text-transform: uppercase; transition: opacity 0.3s; }

        /* MODALS */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal { background: var(--card); padding: 20px; border-radius: 15px; width: 320px; text-align: center; border: 1px solid #555; }
        .modal-wide { background: var(--card); padding: 20px; border-radius: 15px; width: 95%; max-width: 600px; text-align: center; border: 1px solid #555; max-height: 90vh; display:flex; flex-direction:column; overflow-y: auto; }
        
        .display { background: #222; color: var(--primary); padding: 15px; font-size: 2em; font-family: monospace; font-weight: bold; margin-bottom: 15px; border-radius: 8px; min-height: 60px; }
        .key-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .key { background: #444; padding: 15px; font-size: 1.4em; font-weight: bold; border-radius: 8px; cursor: pointer; border: 1px solid #555; color: var(--text-light); }
        .key:active { background: #555; }
        .key-ok { background: var(--success); color: #003300; border: none; grid-column: 1 / -1; margin-top: 5px; }
        .btn-2man { width: 100%; background: var(--blue); color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; margin-bottom: 10px; cursor: pointer; }
        .input-f { width: 100%; padding: 15px; background: #222; border: 2px solid var(--primary); color: white; font-size: 1.2em; text-align: center; margin-bottom: 10px; border-radius: 8px; box-sizing: border-box; }
        .btn-jatka { width: 100%; background: var(--primary); color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1em; cursor: pointer; margin-top: 10px; }
        .search-bar { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #555; background: #222; color: white; margin-bottom: 10px; font-size: 1em; text-align: center; }

        .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .edit-label { text-align: left; font-size: 0.8em; color: #aaa; margin-bottom: 2px; }
        .edit-input { width: 100%; background: #333; border: 1px solid #555; padding: 10px; color: white; border-radius: 5px; box-sizing: border-box; }

        .time-display { font-size: 3em; font-weight: bold; color: var(--primary); margin: 20px 0; letter-spacing: 2px; font-family: monospace; }
        .time-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .time-key { background: #444; padding: 15px; font-size: 1.5em; font-weight: bold; border-radius: 8px; border: 1px solid #555; color: #eee; cursor: pointer; }
        .time-key:active { background: #666; }

        /* SKANNERI */
        #s-ruutu { background: #000; }
        #scan-modal-content { width: 100%; height: 100%; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #reader { width: 100% !important; height: 100% !important; border: none !important; }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover !important; }
        #reader canvas { opacity: 0 !important; display: block !important; position: absolute; }
        #reader__scan_region img, #reader__scan_region svg { display: none !important; } 
        #reader div[style*="border"] { border: none !important; box-shadow: none !important; }
        .scan-mask { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(rgba(0,0,0,0) 120px, rgba(0,0,0,0.5) 130px); pointer-events: none; z-index: 10; }
        .scan-box { position: absolute; width: 340px; height: 80px; border: 2px solid red; box-shadow: 0 0 0 2000px rgba(0,0,0,0.5); z-index: 11; border-radius: 8px; pointer-events: none; }
        .scan-line { position: absolute; width: 320px; height: 1px; background: red; box-shadow: 0 0 6px red; z-index: 12; animation: scan 2s infinite; pointer-events: none; }
        .scan-btn-close { position: absolute; bottom: 40px; z-index: 20; background: red; color: white; border: none; padding: 15px 40px; border-radius: 30px; font-weight: bold; font-size: 1.2em; cursor: pointer; }
        
        #tempChart { position: absolute; left: -9999px; }
        @keyframes scan { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* TYÖKALUPAKKI */
        .tabs { display: flex; background: #222; border-radius: 8px; padding: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #aaa; cursor: pointer; font-weight: bold; font-size: 14px; border-radius: 6px; min-width: 80px; }
        .tab-btn.active { background-color: var(--tb-blue); color: white; }
        .calculator { display: none; animation: fadeIn 0.3s ease-in-out; text-align: left; }
        .calculator.active { display: block; }
        .calculator h2 { color: var(--tb-accent); border-bottom: 1px solid #444; padding-bottom: 10px; margin-top: 0; }
        .calculator h3 { color: white; border-left: 3px solid var(--tb-blue); padding-left: 10px; margin-top: 25px; font-size: 1.1em; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 120px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.8em; color: #aaa; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 5px; box-sizing: border-box; }
        .bend-row { display: grid; grid-template-columns: 1fr 1fr 1fr 40px; gap: 5px; align-items: end; margin-bottom: 8px; padding: 10px; background: #2a2a2a; border-radius: 6px; border-left: 3px solid var(--tb-blue); }
        #profileCanvas { width: 100%; height: 250px; background-color: #000; border-radius: 6px; margin-bottom: 20px; border: 1px solid #333; }
        .result-box { background: rgba(0, 230, 118, 0.1); border: 1px solid var(--tb-accent); color: var(--tb-accent); padding: 15px; border-radius: 6px; text-align: center; font-size: 1.2em; font-weight: bold; margin-top: 20px; }
        .status-pass { color: var(--tb-accent); background: rgba(0, 230, 118, 0.1); padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; border: 1px solid var(--tb-accent); margin-top:5px; }
        .status-fail { color: var(--danger); background: rgba(255, 82, 82, 0.1); padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; border: 1px solid var(--danger); margin-top:5px; }
        .tool-settings { background: #252525; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #333; }
        .warning-text { color: var(--warning); font-weight: bold; font-size: 0.9em; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<canvas id="tempChart" width="400" height="400"></canvas>

<div class="container">
    <div class="vamm-header">
        <div class="vamm-logo">VAMM STEEL OY</div>
        <div class="vamm-sub">Press Brake Pro v3.5</div>
    </div>

    <div id="kelloDisplay" class="main-clock">00:00:00</div>
    
    <div class="dash-grid">
        <div class="dashboard-box" id="dash-shift">
            <div>
                <div class="dash-title">TÄMÄ VUORO</div>
                <div id="shiftEfficiency" class="dash-value">0.00</div>
            </div>
            <div>
                <div class="dash-sub-label">VALMIIT (MIN)</div>
                <div id="shiftDone" class="dash-sub-val">0</div>
            </div>
        </div>
        <div class="dashboard-box" id="dash-period">
            <div>
                <div class="dash-title" id="periodTitle">JAKSO</div>
                <div id="periodEfficiency" class="dash-value">-</div>
            </div>
            <div>
                <div class="dash-sub-label">TODELLISET (H)</div>
                <div id="periodActual" class="dash-sub-val">0.0</div>
            </div>
        </div>
    </div>

    <div class="timeline-wrapper">
        <div class="timeline-bar" id="timelineContainer">
            <div id="bar-asetus" class="seg seg-asetus" style="width:0%"></div>
            <div id="bar-taivutus" class="seg seg-taivutus" style="width:0%"></div>
            <div id="bar-muut" class="seg seg-muut" style="width:0%"></div>
        </div>
        <div class="timeline-legend">
            <span><span class="dot" style="background:var(--accent)"></span>ASETUS</span>
            <span><span class="dot" style="background:var(--success)"></span>TAIVUTUS</span>
            <span><span class="dot" style="background:var(--warning)"></span>MUUT</span>
        </div>
    </div>

    <button onclick="toggleMenu()" style="width:100%; padding:10px; background:var(--special); border:none; border-radius:8px; color:white; font-weight:bold; margin-bottom:10px;">ERITYISTILAT</button>
    <div id="menu-spec" class="special-menu">
        <button id="s-PROTO" class="btn-spec" onclick="tilaVaihda('PROTO')">PROTO</button>
        <button id="s-HÄIRIÖ" class="btn-spec" onclick="tilaVaihda('HÄIRIÖ')">HÄIRIÖ</button>
        <button id="s-HUOLTO" class="btn-spec" onclick="tilaVaihda('HUOLTO')">HUOLTO</button>
    </div>

    <div class="info-row"><div id="box-kortti" class="info-box" onclick="avaaIkkuna('kortti')"><span>KORTTI</span><b id="v-kortti">-</b></div><button class="btn-scan" onclick="avaaSkanneri('kortti')">📷</button></div>
    <div class="info-row"><div id="box-lajike" class="info-box" onclick="avaaIkkuna('lajike')"><span>LAJIMERKKI</span><b id="v-lajike">-</b></div><button class="btn-scan" onclick="avaaSkanneri('lajike')">📷</button></div>
    <div class="info-row"><div id="box-asetus" class="info-box" onclick="avaaIkkuna('asetus')"><span>ASETUS</span><b id="v-asetus">-</b></div></div>
    <div class="info-row"><div id="box-taivutus" class="info-box" onclick="avaaIkkuna('taivutus')"><span>TAIVUTUS</span><b id="v-taivutus">-</b></div></div>
    <div class="info-row"><div id="box-muut" class="info-box" onclick="avaaIkkuna('muut')"><span>MUUT</span><b id="v-muut">-</b></div></div>

    <button id="v-nappi" class="main-action btn-start" onclick="VAIHDA_VUORO()">ALOITA VUORO</button>
    <button class="main-action btn-save" onclick="tallennaKortti()">💾 TALLENNA KORTTI</button>

    <input type="text" id="search-hist" class="search-bar" placeholder="🔍 Hae korttia, lajia tai pvm..." oninput="renderHistory()">

    <div class="hist-header"><span>KORTTI</span><span>LAJI</span><span style="text-align:right">AIKA</span></div>
    <div id="h-lista" class="hist-cont"></div>

    <div class="bottom-tools">
        <button class="btn-tool" onclick="siirraArkistoon()">NOLLAA NYKYINEN HISTORIA</button>
        <button class="btn-tool" onclick="avaaArkisto()">📜 SELAA ARKISTOA</button>
        <button class="btn-tool btn-toolbox" onclick="avaaTyokalut()">🛠️ TYÖKALUPAKKI</button>
        <button class="btn-tool" onclick="lisaaMassiivinenTestidata()">🧪 Lisää testidataa (10pv)</button>
        
        <input type="file" id="file-input" style="display:none" onchange="lataaVarmuuskopio(this)">
        <button class="btn-tool" onclick="document.getElementById('file-input').click()">📂 LATAA VARMUUSKOPIO</button>
        <button class="btn-tool" onclick="tallennaTiedosto()">💾 TALLENNA VARMUUSKOPIO</button>
        
        <div class="safety-wrapper">
            <span class="safety-label">AVAA LUKITUS >></span>
            <label class="switch">
                <input type="checkbox" id="safety-lock" onchange="toggleResetBtn()">
                <span class="slider round"></span>
            </label>
        </div>
        <button id="btn-hard-reset" class="btn-hard-reset" onclick="hardReset()" disabled style="opacity: 0.3;">⚠️ HÄTÄ-NOLLAUS</button>
    </div>
</div>

<div id="toolbox-modal" class="overlay">
    <div class="modal-wide">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="margin:0; color:white;">SÄRMÄÄJÄN TYÖKALUPAKKI</h2>
            <button onclick="suljeTyokalut()" style="background:none; border:none; color:#aaa; font-size:2em; cursor:pointer;">&times;</button>
        </div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('profile')">Profiili</button>
            <button class="tab-btn" onclick="switchTab('tonnage')">Voima</button>
            <button class="tab-btn" onclick="switchTab('trigo')">Kulmat</button>
            <button class="tab-btn" onclick="switchTab('extras')">Ekstrat</button>
        </div>

        <div id="profile" class="calculator active">
            <h2>Profiilin Oikaisu</h2>
            <div class="form-row">
                <div class="form-group"><label>Materiaali</label><select id="p_material" onchange="applyMaterial('profile')"><option value="s235">S235</option><option value="dx51d">DX51D</option><option value="s355">S355</option><option value="dc01">DC01</option><option value="rst">RST</option><option value="hst">HST</option><option value="al">Alu</option></select></div>
                <div class="form-group"><label>Vahvuus</label><input type="number" id="p_thick" value="3.0" step="0.1" onchange="checkVDie(); updateProfile();"></div>
                <div class="form-group"><label>K-kerroin</label><input type="number" id="p_k" value="0.33" step="0.01" onchange="updateProfile()"></div>
            </div>
            <div class="tool-settings">
                <div class="form-row">
                    <div class="form-group"><label>Yläterä</label><select id="p_tool_select" onchange="applyTool()"><option value="1.0">Vakio R1.0</option><option value="1.0">LVD J15W (Suora)</option><option value="0.8">R0.8</option><option value="2.0">R2.0</option><option value="3.0">R3.0</option><option value="custom">Muu...</
