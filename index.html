<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>PBPro v27.3</title>
    <style>
        :root { --bg: #0a0a0a; --primary: #FF6700; --success: #00e676; --danger: #ff1744; --openai: #74aa9c; }
        body { margin: 0; background: var(--bg); color: #f5f5f5; font-family: sans-serif; text-align: center; overflow-x: hidden; }
        .version-tag { color: #fff; font-weight: bold; padding: 10px; background: #bf360c; border-bottom: 2px solid #fff; font-size: 0.8em; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; padding-bottom: 120px; }
        
        .period-header { background: #111; padding: 15px; border-radius: 16px; border: 1px solid var(--openai); margin-bottom: 10px; position: relative; }
        .period-dates { font-size: 0.85em; color: var(--openai); text-transform: uppercase; font-weight: bold; margin-bottom: 8px; display: block; }
        .period-stats { display: flex; justify-content: space-around; border-top: 1px solid #222; padding-top: 10px; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .dash-box { background: #1a1a1a; padding: 12px; border-radius: 16px; border: 1px solid #333; }
        .dash-label { font-size: 0.65em; color: #888; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .dash-val { font-size: 1.5em; font-weight: 800; color: var(--success); }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; text-align: left; }
        .info-box { background: #111; padding: 12px; border-radius: 12px; border: 1px solid #333; cursor: pointer; min-height: 45px; }
        .info-box span { font-size: 0.65em; color: #888; display: block; text-transform: uppercase; }
        .info-box b { color: var(--primary); font-size: 1.05em; display: block; word-break: break-all; }
        
        .combined-box { grid-column: span 2; display: flex; flex-direction: column; justify-content: center; }
        .combined-box b:last-child { color: #aaa; font-size: 0.85em; margin-top: 2px; }

        .main-btn { width: 100%; padding: 18px; border-radius: 14px; border: none; font-size: 1.1em; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; cursor: pointer; }
        .btn-scan { width: 100%; padding: 25px; border-radius: 16px; border: 3px solid var(--openai); background: #0a1a15; color: var(--openai); font-weight: 900; font-size: 1.2em; cursor: pointer; margin-bottom: 20px; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; padding: 20px; overflow-y: auto; }
        .modal-content { background: #1a1a1a; border-radius: 20px; padding: 20px; text-align: left; max-width: 440px; margin: 0 auto; border: 1px solid #333; }
        .modal-content label { font-size: 0.7em; color: #888; text-transform: uppercase; display: block; margin-top: 15px; }
        .modal-content input { width: 100%; background: #222; border: 1px solid #444; padding: 12px; border-radius: 10px; color: white; box-sizing: border-box; font-size: 1em; margin-top: 5px; }
        .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 30px; }

        #cam-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; }
        #video-container { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; flex-direction: column; align-items: center; justify-content: center; }
        #search-input { width: 100%; padding: 12px; background: #222; border: 1px solid #444; border-radius: 10px; color: white; margin-bottom: 15px; box-sizing: border-box; }
        .hist-item { background: #1a1a1a; padding: 12px; margin-bottom: 8px; border-radius: 12px; text-align: left; border-left: 4px solid var(--primary); position: relative; }
        .hist-actions { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); }
        .btn-icon { background: none; border: none; color: #fff; cursor: pointer; font-size: 1.5em; }
    </style>
</head>
<body>

<div class="version-tag">v27.3 • INDEPENDENT TIMES</div>

<div class="container">
    <div class="period-header">
        <span style="position:absolute;top:10px;right:10px;color:#444;font-size:0.7em;" onclick="resetAll()">nollaa</span>
        <div id="txt-period-dates" class="period-dates">JAKSO: -</div>
        <div class="period-stats">
            <div><span class="dash-label">Jakson Kerroin</span><span id="txt-period-pace" style="font-size:1.6em; font-weight:900; color:var(--openai);">0.00</span></div>
            <div style="border-left: 1px solid #222; padding-left: 20px;"><span class="dash-label">Jakson Tunnit</span><span id="txt-period-hours" style="font-size:1.6em; font-weight:900; color:#fff">0.0</span></div>
        </div>
    </div>
    
    <div class="dashboard">
        <div class="dash-box"><span class="dash-label">Vuoron h</span><span id="txt-timer" class="dash-val">0.00</span></div>
        <div class="dash-box"><span class="dash-label">Joutuisuus</span><span id="txt-shift-pace" class="dash-val">0.00</span></div>
    </div>

    <button id="btn-open-camera" class="btn-scan">📸 SKANNAA KORTTI</button>
    
    <div class="info-grid">
        <div class="info-box combined-box" onclick="editCombined()">
            <span>Tuote & Kuvaus</span>
            <b id="val-lajike">-</b>
            <b id="val-kuvaus">-</b>
        </div>
        
        <div class="info-box" onclick="editV('val-tyonr', 'Työnumero')"><span>Työnumero</span><b id="val-tyonr">-</b></div>
        <div class="info-box" onclick="editV('val-piirnro', 'Piirustus')"><span>Piirustus</span><b id="val-piirnro">-</b></div>
        <div class="info-box" onclick="editV('val-asiakas', 'Asiakas')"><span>Asiakas</span><b id="val-asiakas">-</b></div>
        
        <div class="info-box" onclick="openMuutModal()" style="background:#1a231a; border-color:#2e7d32;">
            <span style="color:#00e676;">TYÖVAIHE</span>
            <b id="val-muu-nimi">-</b>
        </div>
        
        <div class="info-box" onclick="editV('val-asetusaika', 'Asetus')"><span>Asetus</span><b id="val-asetusaika">-</b></div>
        <div class="info-box" onclick="editV('val-taivutusaika', 'Aika / kpl')"><span>Aika</span><b id="val-taivutusaika">-</b></div>
    </div>

    <button id="btn-save" style="background:var(--primary); color:white" class="main-btn">💾 TALLENNA KORTTI</button>
    <button id="btn-start-shift" style="background:var(--success); color:black" class="main-btn">ALOITA VUORO</button>
    <button id="btn-stop-shift" style="background:var(--danger); color:white; display:none;" class="main-btn">LOPETA VUORO</button>
    
    <input type="text" id="search-input" placeholder="Hae historiasta..." oninput="renderHistory()">
    <div id="hist-list"></div>
</div>

<div id="muut-modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--success);">Määritä työvaiheen nimi</h3>
        <label>Työvaiheen nimi</label>
        <input type="text" id="muu-nimi-in" list="step-history" placeholder="HITSAUS, HIONTA jne.">
        <datalist id="step-history"></datalist>
        <p style="font-size:0.7em; color:#888; margin-top:10px;">Ajat syötetään päänäkymän laatikoihin.</p>
        <div class="modal-actions">
            <button onclick="document.getElementById('muut-modal').style.display='none'" style="background:#333; color:white; border:none; padding:15px; border-radius:10px;">PERUUTA</button>
            <button onclick="saveMuut()" style="background:var(--success); color:black; border:none; padding:15px; border-radius:10px; font-weight:bold;">TALLENNA</button>
        </div>
    </div>
</div>

<div id="edit-modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--openai);">Muokkaa korttia</h3>
        <input type="hidden" id="edit-id">
        <label>Työnumero</label><input type="text" id="edit-tyo">
        <label>Piirustus</label><input type="text" id="edit-piir">
        <label>Tuote</label><input type="text" id="edit-laji">
        <label>Kuvaus</label><input type="text" id="edit-kuvaus">
        <label>Asiakas</label><input type="text" id="edit-asia">
        <label>Työvaihe</label><input type="text" id="edit-vaihe" list="step-history">
        <label>Kpl</label><input type="number" id="edit-kpl">
        <label>Asetus</label><input type="text" id="edit-asetus">
        <label>Aika</label><input type="text" id="edit-taivutus">
        <div class="modal-actions">
            <button onclick="deleteEntry()" style="background:var(--danger); color:white; padding:15px; border-radius:10px; border:none;">POISTA</button>
            <button onclick="saveEdit()" style="background:var(--success); color:black; padding:15px; border-radius:10px; border:none;">TALLENNA</button>
        </div>
        <button onclick="document.getElementById('edit-modal').style.display='none'" style="width:100%; background:none; border:none; color:#888; margin-top:20px;">SULJE</button>
    </div>
</div>

<div id="loader"><p id="loader-txt">Analysoidaan...</p></div>

<div id="cam-overlay">
    <div id="video-container"><video id="video" playsinline muted></video></div>
    <div style="position:absolute; bottom:30px; width:100%; text-align:center;">
        <button id="snap" style="width:75px; height:75px; border-radius:50%; background:white; border:6px solid var(--openai); box-shadow: 0 0 20px rgba(0,0,0,0.5);"></button><br><br>
        <button onclick="closeCam()" style="color:white; background:rgba(0,0,0,0.5); border:none; padding:10px 20px; border-radius:20px;">SULJE</button>
    </div>
</div>

<script>
const payPeriods = [{ start: "2026-02-16", end: "2026-02-28" }, { start: "2026-03-01", end: "2026-03-15" }];
let State = {
    startTime: localStorage.getItem('pb_start') ? new Date(parseInt(localStorage.getItem('pb_start'))) : null,
    history: JSON.parse(localStorage.getItem('pbpro_master_history') || '[]'),
    stream: null
};

function saveToDisk() {
    localStorage.setItem('pbpro_master_history', JSON.stringify(State.history));
    if(State.startTime) localStorage.setItem('pb_start', State.startTime.getTime());
    else localStorage.removeItem('pb_start');
}

function fixDecimals(val) {
    if (!val) return "0";
    let s = val.toString().replace(',', '.');
    if (!s.includes('.') && s.length >= 3) return (parseFloat(s) / 100).toString();
    return s.replace(/[^0-9.]/g, '') || "0";
}

function updateStepHistory() {
    const steps = [...new Set(State.history.map(h => h.vaihe).filter(v => v && v !== "-" && v !== "SÄRMÄYS"))];
    document.getElementById('step-history').innerHTML = steps.map(s => `<option value="${s}">`).join('');
}

function updateUI() {
    const now = new Date();
    const p = payPeriods.find(p => { 
        const s = new Date(p.start); const e = new Date(p.end); e.setHours(23,59,59); 
        return now >= s && now <= e; 
    }) || payPeriods[0];
    document.getElementById('txt-period-dates').innerText = `JAKSO: ${new Date(p.start).toLocaleDateString('fi-FI')} - ${new Date(p.end).toLocaleDateString('fi-FI')}`;
    const pS = new Date(p.start); const pE = new Date(p.end); pE.setHours(23,59,59);
    const pD = State.history.filter(h => {
        const pts = h.pvm.split('.'); const d = new Date(pts[2], pts[1]-1, pts[0]);
        return d >= pS && d <= pE;
    });
    const shiftH = pD.filter(h => h.isShift).reduce((s, i) => s + (i.hours || 0), 0);
    let curShiftH = State.startTime ? (now - State.startTime) / 3600000 : 0;
    document.getElementById('btn-start-shift').style.display = State.startTime ? 'none' : 'block';
    document.getElementById('btn-stop-shift').style.display = State.startTime ? 'block' : 'none';
    const totalH = shiftH + curShiftH;
    document.getElementById('txt-period-hours').innerText = totalH.toFixed(1);
    document.getElementById('txt-timer').innerText = curShiftH.toFixed(2);
    const goalMins = pD.filter(h => !h.isShift).reduce((s, i) => s + (i.sumMins || 0), 0);
    const todayGoal = pD.filter(h => h.pvm === now.toLocaleDateString('fi-FI') && !h.isShift).reduce((s, i) => s + (i.sumMins || 0), 0);
    document.getElementById('txt-shift-pace').innerText = curShiftH > 0.01 ? ((todayGoal/60)/curShiftH).toFixed(2) : "0.00";
    document.getElementById('txt-period-pace').innerText = totalH > 0.01 ? ((goalMins/60)/totalH).toFixed(2) : "0.00";
}

function renderHistory() {
    const s = document.getElementById('search-input').value.toLowerCase();
    const f = State.history.filter(h => (h.tyo||'').toLowerCase().includes(s) || (h.kuvaus||'').toLowerCase().includes(s) || (h.asia||'').toLowerCase().includes(s));
    document.getElementById('hist-list').innerHTML = f.map(e => `
        <div class="hist-item ${e.isShift ? 'work-shift' : ''}">
            <div style="padding-right: 60px;">
                ${e.isShift ? `<b>⏱️ VUORO</b><br><small>${e.info} • ${e.hours.toFixed(2)} h</small>` : 
                `<b>${e.tyo}</b> | ${e.tuote}<br><small>${e.vaihe || 'SÄRMÄYS'} • ${e.asia || '-'} • ${e.kpl} kpl • ${e.sumMins.toFixed(1)} min</small>`}
            </div>
            <div class="hist-actions"><button class="btn-icon" onclick="openModal(${e.id})">✏️</button></div>
        </div>`).join('');
    updateStepHistory();
}

function openMuutModal() {
    const current = document.getElementById('val-muu-nimi').innerText;
    document.getElementById('muu-nimi-in').value = current === "-" ? "" : current;
    document.getElementById('muut-modal').style.display = 'block';
}

function saveMuut() {
    document.getElementById('val-muu-nimi').innerText = document.getElementById('muu-nimi-in').value.toUpperCase() || "-";
    document.getElementById('muut-modal').style.display = 'none';
}

function editCombined() {
    let t = prompt("Tuote (Koodi):", document.getElementById('val-lajike').innerText);
    let k = prompt("Kuvaus:", document.getElementById('val-kuvaus').innerText);
    if(t!==null) document.getElementById('val-lajike').innerText = t.toUpperCase();
    if(k!==null) document.getElementById('val-kuvaus').innerText = k.toUpperCase();
}

function openModal(id) {
    const item = State.history.find(h => h.id === id);
    if(!item || item.isShift) return;
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-tyo').value = item.tyo;
    document.getElementById('edit-piir').value = item.piir || "";
    document.getElementById('edit-laji').value = item.tuote;
    document.getElementById('edit-kuvaus').value = item.kuvaus || "";
    document.getElementById('edit-asia').value = item.asia || "";
    document.getElementById('edit-vaihe').value = item.vaihe || "SÄRMÄYS";
    document.getElementById('edit-kpl').value = item.kpl;
    document.getElementById('edit-asetus').value = item.asetus || 0;
    document.getElementById('edit-taivutus').value = item.taivutus || 0;
    document.getElementById('edit-modal').style.display = 'block';
}

function saveEdit() {
    const id = parseInt(document.getElementById('edit-id').value);
    const item = State.history.find(h => h.id === id);
    const kpl = parseInt(document.getElementById('edit-kpl').value) || 0;
    const a = parseFloat(document.getElementById('edit-asetus').value) || 0;
    const t = parseFloat(document.getElementById('edit-taivutus').value) || 0;
    item.tyo = document.getElementById('edit-tyo').value.toUpperCase();
    item.piir = document.getElementById('edit-piir').value.toUpperCase();
    item.tuote = document.getElementById('edit-laji').value.toUpperCase();
    item.kuvaus = document.getElementById('edit-kuvaus').value.toUpperCase();
    item.asia = document.getElementById('edit-asia').value.toUpperCase();
    item.vaihe = document.getElementById('edit-vaihe').value.toUpperCase();
    item.kpl = kpl; item.asetus = a; item.taivutus = t; item.sumMins = a + (t * kpl);
    saveToDisk(); document.getElementById('edit-modal').style.display = 'none';
    renderHistory(); updateUI();
}

function deleteEntry() {
    if(confirm("Poistetaanko kortti?")) {
        const id = parseInt(document.getElementById('edit-id').value);
        State.history = State.history.filter(h => h.id !== id);
        saveToDisk(); document.getElementById('edit-modal').style.display = 'none';
        renderHistory(); updateUI();
    }
}

document.getElementById('btn-open-camera').onclick = async () => {
    try {
        State.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
        document.getElementById('video').srcObject = State.stream;
        document.getElementById('cam-overlay').style.display='block';
        document.getElementById('video').play();
    } catch(e) { alert("Salli kamera."); }
};
function closeCam() { if(State.stream) State.stream.getTracks().forEach(t=>t.stop()); document.getElementById('cam-overlay').style.display='none'; }

document.getElementById('snap').onclick = async () => {
    const v = document.getElementById('video'), c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const b64 = c.toDataURL('image/jpeg', 0.9);
    closeCam();
    document.getElementById('loader').style.display='flex';
    try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('openai_api_key') },
            body: JSON.stringify({
                model: "gpt-4o",
                messages: [{ role: "user", content: [
                    { type: "text", text: "Tunnista A4. Lue: Työnumero (6 nro), Piirustusnumero (yläoikea), Tuote (koodi ylävasen), Kuvaus (nimeke koodin alla), Asiakas, SÄRMÄYS Asetus ja Kapasiteettiaika. JSON: {\"tyo\":\"...\",\"piir\":\"...\",\"laji\":\"...\",\"kuvaus\":\"...\",\"asia\":\"...\",\"asetus\":\"...\",\"taivutus\":\"...\"}" },
                    { type: "image_url", image_url: { url: b64 } }
                ]}]
            })
        });
        const d = await response.json(); const res = JSON.parse(d.choices[0].message.content.match(/\{.*\}/s)[0]);
        document.getElementById('val-tyonr').innerText = res.tyo || "-";
        document.getElementById('val-lajike').innerText = (res.laji || "-").toUpperCase();
        document.getElementById('val-kuvaus').innerText = (res.kuvaus || "-").toUpperCase();
        document.getElementById('val-asiakas').innerText = res.asia || "-";
        document.getElementById('val-piirnro').innerText = (res.piir || "-").toUpperCase();
        document.getElementById('val-asetusaika').innerText = fixDecimals(res.asetus);
        document.getElementById('val-taivutusaika').innerText = fixDecimals(res.taivutus);
        document.getElementById('val-muu-nimi').innerText = "-"; 
    } catch(e) { }
    finally { document.getElementById('loader').style.display='none'; }
};

document.getElementById('btn-save').onclick = () => {
    const tyo = document.getElementById('val-tyonr').innerText;
    if(tyo === "-" || tyo.length < 5) return alert("Puutteelliset tiedot!");
    const kpl = prompt("Kpl-määrä?", "1");
    if(!kpl) return;
    const a = parseFloat(document.getElementById('val-asetusaika').innerText) || 0;
    const t = parseFloat(document.getElementById('val-taivutusaika').innerText) || 0;
    let vaihe = document.getElementById('val-muu-nimi').innerText;
    if (vaihe === "-") vaihe = "SÄRMÄYS";
    State.history.unshift({ 
        id: Date.now(), pvm: new Date().toLocaleDateString('fi-FI'), tyo, piir: document.getElementById('val-piirnro').innerText,
        tuote: document.getElementById('val-lajike').innerText, kuvaus: document.getElementById('val-kuvaus').innerText, 
        asia: document.getElementById('val-asiakas').innerText, vaihe: vaihe,
        kpl, asetus: a, taivutus: t, sumMins: a + (t * parseInt(kpl)) 
    });
    saveToDisk(); renderHistory(); updateUI();
};

document.getElementById('btn-start-shift').onclick = () => { State.startTime = new Date(); saveToDisk(); updateUI(); };
document.getElementById('btn-stop-shift').onclick = () => {
    const d = new Date();
    State.history.unshift({ id: Date.now(), pvm: d.toLocaleDateString('fi-FI'), isShift: true, hours: (d - State.startTime) / 3600000, info: `Vuoro: ${State.startTime.getHours()}.${State.startTime.getMinutes()} - ${d.getHours()}.${d.getMinutes()}` });
    State.startTime = null; saveToDisk(); renderHistory(); updateUI();
};

function resetAll() { if(confirm("Nollataanko koko jakson historian tiedot?")) { State.history = []; saveToDisk(); renderHistory(); updateUI(); } }
function editV(id, msg) { let v = prompt(msg, document.getElementById(id).innerText); if(v!==null) { if(id==='val-lajike'||id==='val-kuvaus'||id==='val-piirnro')v=v.toUpperCase(); if(id==='val-asetusaika'||id==='val-taivutusaika')v=fixDecimals(v); document.getElementById(id).innerText=v; } }
setInterval(updateUI, 5000); updateUI(); renderHistory();
</script>
</body>
</html>
