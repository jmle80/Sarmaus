<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiUEJQcm8iLCJzaG9ydF9uYW1lIjoiUEJQcm8iLCJzdGFydF91cmwiOiIuL2luZGV4Lmh0bWwiLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMGEwYTBhIiwidGhlbWVfY29sb3IiOiIjMGEwYTBhIn0=">

    <title>PBPro v7.7</title>
    
    <style>
        :root { --bg: #0a0a0a; --primary: #FF6700; --success: #00e676; }
        * { box-sizing: border-box; touch-action: manipulation; }
        body { margin: 0; background: var(--bg); color: #f5f5f5; font-family: sans-serif; padding-top: env(safe-area-inset-top); }
        .version-tag { color: #00e676; font-weight: bold; text-align: center; padding: 10px; background: #111; border-bottom: 1px solid #333; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }
        .btn-scan { width: 100%; padding: 25px; border-radius: 16px; border: 3px solid var(--success); background: #051505; color: var(--success); font-weight: 900; font-size: 1.2em; cursor: pointer; }
        .info-box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        #camera-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .video-wrapper { width: 95%; height: 60%; border: 2px solid var(--success); border-radius: 15px; overflow: hidden; position: relative; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10001; flex-direction: column; align-items: center; justify-content: center; }
        .spinner { border: 4px solid #333; border-top: 4px solid var(--success); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="version-tag">v7.7 EDGE STABLE</div>

<div class="container">
    <button id="btn-open-camera" class="btn-scan">🤖 SKANNAA KORTTI (AI)</button>
    <div style="margin: 20px 0;">
        <div class="info-box"><span>Työnumero</span><b id="val-kortti">-</b></div>
        <div class="info-box"><span>Lajimerkki</span><b id="val-lajike">-</b></div>
        <div class="info-box"><span>Asetus</span><b id="val-asetus">-</b></div>
        <div class="info-box"><span>Std-aika</span><b id="val-taivutus">-</b></div>
    </div>
    <button onclick="localStorage.removeItem('claude_api_key'); location.reload();" style="width:100%; background:none; border:none; color:#444; font-size:0.7em; text-decoration:underline;">VAIHDA API-AVAIN</button>
</div>

<div id="camera-overlay">
    <div class="video-wrapper"><video id="video" playsinline></video></div>
    <button id="btn-capture" style="background:var(--success); color:black; padding:20px 50px; border-radius:40px; border:none; font-weight:900; font-size:1.2em; margin-top:20px;">📸 OTA KUVA</button>
</div>

<div id="loader" class="loader"><div class="spinner"></div><p style="color:var(--success); margin-top:20px;">Analysoidaan...</p></div>

<script>
let videoStream = null;

async function startCamera() {
    document.getElementById('camera-overlay').style.display = 'flex';
    try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } } });
        document.getElementById('video').srcObject = videoStream;
        document.getElementById('video').play();
    } catch (err) { alert("Kamera-virhe"); }
}

document.getElementById('btn-capture').onclick = async () => {
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const base64 = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
    if (videoStream) videoStream.getTracks().forEach(t => t.stop());
    document.getElementById('camera-overlay').style.display = 'none';
    document.getElementById('loader').style.display = 'flex';

    let apiKey = localStorage.getItem('claude_api_key') || prompt("Syötä API-avain:");
    if (apiKey) localStorage.setItem('claude_api_key', apiKey.trim()); else return;

    try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'dangerously-allow-browser': 'true' },
            body: JSON.stringify({
                model: "claude-3-5-sonnet-20240620", max_tokens: 1024,
                messages: [{ role: "user", content: [
                    { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
                    { type: "text", text: "Extract JSON: {tyonumero, lajike, asetus, stdaika}" }
                ]}]
            })
        });
        const result = await response.json();
        const data = JSON.parse(result.content[0].text);
        document.getElementById('val-kortti').innerText = data.tyonumero;
        document.getElementById('val-lajike').innerText = data.lajike;
        document.getElementById('val-asetus').innerText = data.asetus + " min";
        document.getElementById('val-taivutus').innerText = data.stdaika + " min";
    } catch (e) { alert("Virhe: " + e.message); }
    finally { document.getElementById('loader').style.display = 'none'; }
};

document.getElementById('btn-open-camera').onclick = startCamera;

// PAKOLLINEN SERVICE WORKER EDGELLE
if ('serviceWorker' in navigator) {
    const sw = "self.addEventListener('fetch', function(e) {});";
    const blob = new Blob([sw], {type: 'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob));
}
</script>
</body>
</html>
