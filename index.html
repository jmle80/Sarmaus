<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PBPro v16.4</title>
    <style>
        :root { --bg: #0a0a0a; --primary: #FF6700; --success: #00e676; --danger: #ff1744; --openai: #74aa9c; }
        body { margin: 0; background: var(--bg); color: #f5f5f5; font-family: sans-serif; text-align: center; }
        .version-tag { color: #fff; font-weight: bold; padding: 10px; background: #222; border-bottom: 2px solid var(--primary); font-size: 0.8em; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; padding-bottom: 100px; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .dash-box { background: #1a1a1a; padding: 12px; border-radius: 16px; border: 1px solid #333; }
        .dash-label { font-size: 0.7em; color: #888; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .dash-val { font-size: 1.5em; font-weight: 800; color: var(--success); }
        .period-info { font-size: 0.75em; color: var(--openai); margin-bottom: 10px; background: #111; padding: 8px; border-radius: 8px; border: 1px solid #222; }
        .main-btn { width: 100%; padding: 18px; border-radius: 14px; border: none; font-size: 1.1em; font-weight: 800; text-transform: uppercase; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="version-tag">v16.4 • OFFICIAL 2026 PAY PERIODS</div>

<div class="container">
    <div id="txt-period-label" class="period-info">Etsitään palkkajaksoa...</div>
    
    <div class="dashboard">
        <div class="dash-box">
            <span class="dash-label">Työaika</span>
            <span id="txt-timer" class="dash-val">00:00</span>
        </div>
        <div class="dash-box">
            <span class="dash-label">Vuoro %</span>
            <span id="txt-shift-pace" class="dash-val">-%</span>
        </div>
        <div class="dash-box" style="grid-column: span 2">
            <span class="dash-label">Jakson Joutuisuus %</span>
            <span id="txt-period-pace" class="dash-val" style="color:var(--openai)">-%</span>
        </div>
    </div>

    <button id="btn-open-camera" style="width:100%; padding:25px; border-radius:16px; border:3px solid var(--openai); background:#0a1a15; color:var(--openai); font-weight:900; font-size:1.2em; cursor:pointer; margin-bottom:20px;">📸 SKANNAA KORTTI</button>
    <button id="btn-save" style="background:var(--primary); color:white" class="main-btn">💾 TALLENNA KORTTI</button>
    <button id="btn-shift" style="background:var(--success); color:black" class="main-btn">VUORON HALLINTA</button>
    
    <div id="hist-list" style="margin-top:20px;"></div>
</div>

<script>
// Palkkajaksot 2026 datataulukko
const payPeriods2026 = [
    { start: "2025-12-16", end: "2025-12-31", payDay: "10.1.2026" },
    { start: "2026-01-01", end: "2026-01-15", payDay: "25.1.2026" },
    { start: "2026-01-16", end: "2026-01-31", payDay: "10.2.2026" },
    { start: "2026-02-01", end: "2026-02-15", payDay: "25.2.2026" },
    { start: "2026-02-16", end: "2026-02-28", payDay: "10.3.2026" },
    { start: "2026-03-01", end: "2026-03-15", payDay: "25.3.2026" },
    { start: "2026-03-16", end: "2026-03-31", payDay: "10.4.2026" },
    { start: "2026-04-01", end: "2026-04-15", payDay: "25.4.2026" },
    { start: "2026-04-16", end: "2026-04-30", payDay: "10.5.2026" },
    { start: "2026-05-01", end: "2026-05-15", payDay: "25.5.2026" },
    { start: "2026-05-16", end: "2026-05-31", payDay: "10.6.2026" },
    { start: "2026-06-01", end: "2026-06-15", payDay: "25.6.2026" },
    { start: "2026-06-16", end: "2026-06-30", payDay: "10.7.2026" },
    { start: "2026-07-01", end: "2026-07-15", payDay: "25.7.2026" },
    { start: "2026-07-16", end: "2026-07-31", payDay: "10.8.2026" },
    { start: "2026-08-01", end: "2026-08-15", payDay: "25.8.2026" },
    { start: "2026-08-16", end: "2026-08-31", payDay: "10.9.2026" },
    { start: "2026-09-01", end: "2026-09-15", payDay: "25.9.2026" },
    { start: "2026-09-16", end: "2026-09-30", payDay: "10.10.2026" },
    { start: "2026-10-01", end: "2026-10-15", payDay: "25.10.2026" },
    { start: "2026-10-16", end: "2026-10-31", payDay: "10.11.2026" },
    { start: "2026-11-01", end: "2026-11-15", payDay: "25.11.2026" },
    { start: "2026-11-16", end: "2026-11-30", payDay: "10.12.2026" },
    { start: "2026-12-01", end: "2026-12-15", payDay: "25.12.2026" }
];

let State = { 
    running: false, 
    startTime: null, 
    history: JSON.parse(localStorage.getItem('pbpro_v16_hist') || '[]')
};

function getCurrentPeriod() {
    const now = new Date();
    return payPeriods2026.find(p => {
        const s = new Date(p.start);
        const e = new Date(p.end);
        e.setHours(23, 59, 59);
        return now >= s && now <= e;
    }) || payPeriods2026[0];
}

function updateUI() {
    const p = getCurrentPeriod();
    if (p) {
        const sStr = new Date(p.start).toLocaleDateString('fi-FI');
        const eStr = new Date(p.end).toLocaleDateString('fi-FI');
        document.getElementById('txt-period-label').innerHTML = 
            `JAKSO: ${sStr} - ${eStr}<br>TILIPÄIVÄ: ${p.payDay}`;
    }

    if (!State.startTime) return;
    const now = new Date();
    const diffMins = (now - State.startTime) / 60000;

    // Vuoron joutuisuus
    const shiftTargets = State.history
        .filter(h => h.pvm === new Date().toLocaleDateString('fi-FI'))
        .reduce((s, i) => s + (i.sumMins || 0), 0);
    const shiftPace = diffMins > 0 ? (shiftTargets / diffMins) * 100 : 0;
    document.getElementById('txt-shift-pace').innerText = shiftPace.toFixed(1) + "%";

    // Jakson joutuisuus
    const pStart = new Date(p.start);
    const pEnd = new Date(p.end);
    pEnd.setHours(23,59,59);

    const periodHistory = State.history.filter(h => {
        const parts = h.pvm.split('.');
        const hDate = new Date(parts[2], parts[1]-1, parts[0]);
        return hDate >= pStart && hDate <= pEnd;
    });

    const periodTargets = periodHistory.reduce((s, i) => s + (i.sumMins || 0), 0);
    const activeDays = [...new Set(periodHistory.map(h => h.pvm))].length;
    const estimatedWorkMins = (activeDays * 8 * 60) || 1; // Oletus 8h/pvä
    const periodPace = (periodTargets / estimatedWorkMins) * 100;
    
    document.getElementById('txt-period-pace').innerText = periodPace.toFixed(1) + "%";
}

// Muu kameran ja tallennuksen logiikka pysyy ennallaan...
setInterval(updateUI, 1000);
</script>
</body>
</html>
