<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Työajanseuranta PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4CAF50">
    <style>
        /* Versio nro tyyli: Ensimmäinen rivi, erottuva väri */
        #version-tag { color: #ff5722; font-weight: bold; margin-bottom: 10px; }
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 500px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 12px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }
        .start-btn { background-color: #4CAF50; color: white; border: none; }
        .reset-btn { background-color: #f44336; color: white; border: none; }
        #history { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="version-tag">Versio 2.1.0 (PWA)</div>
    <h2>Työkirjaus</h2>

    <label>Kortin numero (6 numeroa):</label>
    <input type="text" id="cardNumber" maxlength="6" placeholder="Esim. 123456">

    <label>Lajimerkki:</label>
    <input type="text" id="typeMark" placeholder="Esim. ABC" oninput="this.value = this.value.toUpperCase()">

    <button class="start-btn" onclick="startShift()">ALOITA VUORO</button>
    <button class="reset-btn" onclick="resetHistory()">NOLLAA HISTORIA</button>

    <div id="history">
        <h3>Historia</h3>
        <ul id="logList"></ul>
    </div>
</div>

<script>
    // 1. PWA Service Worker Rekisteröinti
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('PWA: Service Worker rekisteröity'))
                .catch(err => console.error('PWA: Virhe', err));
        });
    }

    // 2. Toiminnallisuudet (Kortin nro tarkistus, suuraakkoset, ääni)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playAlertSound() {
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); 
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.2);
    }

    function startShift() {
        const card = document.getElementById('cardNumber').value;
        const type = document.getElementById('typeMark').value;

        // Tarkistus: Kortin numero on tasan 6 numeroa
        if (!/^\d{6}$/.test(card)) {
            alert("Virhe: Kortin numero on oltava tasan 6 numeroa!");
            return;
        }

        if (!type) {
            alert("Anna lajimerkki!");
            return;
        }

        playAlertSound();
        const entry = `${new Date().toLocaleString()} - Kortti: ${card}, Laji: ${type}`;
        const li = document.createElement('li');
        li.textContent = entry;
        document.getElementById('logList').appendChild(li);
        
        // Tallennus (simuloitu backup-toiminto)
        localStorage.setItem('lastEntry', entry);
        console.log("Vuoro aloitettu ja varmuuskopioitu.");
    }

    function resetHistory() {
        if (confirm("Haluatko varmasti nollata koko jakson historian?")) {
            document.getElementById('logList').innerHTML = "";
            localStorage.clear();
            alert("Historia nollattu.");
        }
    }
</script>

</body>
</html>
