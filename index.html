<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PBPro v8.2</title>
    <style>
        :root { --bg: #000; --primary: #FF6700; --success: #00e676; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; text-align: center; }
        .version-tag { color: var(--success); font-weight: bold; padding: 10px; font-size: 0.8em; border-bottom: 1px solid #222; }
        .container { padding: 15px; }
        .btn-scan { width: 100%; padding: 25px; border-radius: 16px; border: 2px solid var(--success); background: #051505; color: var(--success); font-weight: 900; font-size: 1.2em; margin-bottom: 20px; }
        .info-box { background: #111; padding: 15px; border-radius: 10px; border: 1px solid #333; margin-bottom: 8px; display: flex; justify-content: space-between; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        #cam-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; }
    </style>
</head>
<body>

<div class="version-tag">v8.2 PROXY-FIX (TOIMII PALKIN KANSSA)</div>

<div class="container">
    <button id="btn-open-camera" class="btn-scan">🤖 SKANNAA KORTTI</button>
    <div class="info-box"><span>Työnumero</span><b id="v-nr">-</b></div>
    <div class="info-box"><span>Lajike</span><b id="v-laji">-</b></div>
    <button onclick="localStorage.removeItem('claude_api_key'); location.reload();" style="color:#444; background:none; border:none; margin-top:20px; text-decoration:underline;">Nollaa API-avain</button>
</div>

<div id="loader"><p>AI Analysoi (Proxy)...</p></div>

<div id="cam-overlay">
    <video id="video" style="width:100%; height:80%; object-fit:cover;" playsinline></video>
    <button id="snap" style="width:80%; margin:20px; padding:20px; background:var(--success); border:none; border-radius:50px; font-weight:bold;">📸 OTA KUVA</button>
</div>

<script>
async function startCamera() {
    const s = await navigator.mediaDevices.getUserMedia({video: {facingMode:"environment"}});
    document.getElementById('video').srcObject = s;
    document.getElementById('video').play();
    document.getElementById('cam-overlay').style.display = 'block';
}

async function snap() {
    const v = document.getElementById('video');
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    const base64 = c.toDataURL('image/jpeg', 0.6).split(',')[1];
    
    v.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('cam-overlay').style.display = 'none';
    document.getElementById('loader').style.display = 'flex';

    let key = localStorage.getItem('claude_api_key') || prompt("Syötä API-avain:");
    if(key) localStorage.setItem('claude_api_key', key.trim());

    // KÄYTETÄÄN PROXY-PALVELINTA KIERTÄMÄÄN ESTOT
    const proxy = 'https://corsproxy.io/?';
    const target = 'https://api.anthropic.com/v1/messages';

    try {
        const r = await fetch(proxy + encodeURIComponent(target), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'x-api-key': key,
                'anthropic-version': '2023-06-01'
            },
            body: JSON.stringify({
                model: "claude-3-5-sonnet-20240620", max_tokens: 500,
                messages: [{role: "user", content: [{type: "image", source: {type: "base64", media_type: "image/jpeg", data: base64}}, {type: "text", text: "JSON: {nr, laji}"}]}]
            })
        });
        const d = await r.json();
        const res = JSON.parse(d.content[0].text);
        document.getElementById('v-nr').innerText = res.nr;
        document.getElementById('v-laji').innerText = res.laji;
    } catch(e) { 
        alert("Virhe: Yhteys epäonnistui. Varmista API-avain."); 
    } finally { 
        document.getElementById('loader').style.display = 'none'; 
    }
}

document.getElementById('btn-open-camera').onclick = startCamera;
document.getElementById('snap').onclick = snap;
</script>
</body>
</html>
