<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiUHJlc3MgQnJha2UgUHJvIiwic2hvcnRfbmFtZSI6IlBCUHJvIiwic3RhcnRfdXJsIjoiaW5kZXguaHRtbCIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwic2NvcGUiOiIvU2FybWEvIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwYTBhMGEiLCJ0aGVtZV9jb2xvciI6IiMwYTBhMGEifQ==">

    <title>PBPro v8.0</title>
    
    <style>
        :root { --bg: #0a0a0a; --primary: #FF6700; --success: #00e676; }
        body { margin: 0; background: var(--bg); color: #f5f5f5; font-family: sans-serif; padding-top: env(safe-area-inset-top); text-align: center; }
        .version-tag { color: var(--success); font-weight: bold; padding: 10px; background: #111; border-bottom: 1px solid #333; font-size: 0.8em; }
        .container { max-width: 480px; margin: 0 auto; padding: 15px; }
        
        /* Asennusnappi */
        #install-btn { display: none; width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; margin-bottom: 20px; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .btn-scan { width: 100%; padding: 25px; border-radius: 16px; border: 3px solid var(--success); background: #051505; color: var(--success); font-weight: 900; font-size: 1.2em; cursor: pointer; }
        .info-box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #333; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        #loader { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        #cam-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 500; flex-direction: column; }
    </style>
</head>
<body>

<div class="version-tag">v8.0 INSTALLER EDITION</div>

<div class="container">
    <button id="install-btn">📥 ASENNA SOVELLUS KOTINÄYTÖLLE</button>

    <button id="btn-open-camera" class="btn-scan">🤖 SKANNAA KORTTI</button>
    
    <div class="info-box"><span>Työnumero</span><b id="v-nr">-</b></div>
    <div class="info-box"><span>Lajike</span><b id="v-laji">-</b></div>

    <p style="font-size: 0.7em; color: #555; margin-top: 30px;">
        Jos osoitepalkki näkyy, paina selaimen valikosta "Lisää puhelimeen" tai "Asenna".
    </p>
</div>

<div id="loader">
    <div style="border: 4px solid #333; border-top: 4px solid var(--success); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
    <p>AI Analysoi...</p>
</div>

<div id="cam-overlay">
    <video id="video" style="width:100%; height:80%; object-fit:cover;" playsinline></video>
    <button id="snap" style="width:80%; margin: 20px auto; padding:20px; background:var(--success); border:none; border-radius:50px; font-weight:bold; font-size:1.2em;">📸 OTA KUVA</button>
</div>

<script>
let deferredPrompt;
const installBtn = document.getElementById('install-btn');

// Kuunnellaan asennusmahdollisuutta
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
});

installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installBtn.style.display = 'none';
        deferredPrompt = null;
    }
});

// Kamera ja Analyysi
async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode:"environment"}});
    document.getElementById('video').srcObject = stream;
    document.getElementById('video').play();
    document.getElementById('cam-overlay').style.display = 'flex';
}

async function snap() {
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const base64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
    
    video.srcObject.getTracks().forEach(t => t.stop());
    document.getElementById('cam-overlay').style.display = 'none';
    document.getElementById('loader').style.display = 'flex';

    let key = localStorage.getItem('claude_api_key') || prompt("Syötä API-avain:");
    if(key) localStorage.setItem('claude_api_key', key.trim());

    try {
        const r = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'dangerously-allow-browser': 'true'},
            body: JSON.stringify({
                model: "claude-3-5-sonnet-20240620", max_tokens: 500,
                messages: [{role: "user", content: [{type: "image", source: {type: "base64", media_type: "image/jpeg", data: base64}}, {type: "text", text: "JSON: {nr, laji}"}]}]
            })
        });
        const d = await r.json();
        const res = JSON.parse(d.content[0].text);
        document.getElementById('v-nr').innerText = res.nr;
        document.getElementById('v-laji').innerText = res.laji;
    } catch(e) { alert("Virhe: " + e.message); }
    finally { document.getElementById('loader').style.display = 'none'; }
}

document.getElementById('btn-open-camera').onclick = startCamera;
document.getElementById('snap').onclick = snap;

// Service Worker (pakollinen asennukselle)
if ('serviceWorker' in navigator) {
    const sw = "self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));";
    const blob = new Blob([sw], {type: 'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob));
}
</script>
<style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
</body>
</html>
